<script id="seedBank" type="application/json">{"format":"examlab.quiz.v1","id":"hoa-ester-lipid-100-2026","title":"100 câu Ester – Lipid","subject":"hoa","description":"Đề luyện chuyên đề Ester – Lipid · Trắc nghiệm trả lời ngắn. Gồm 100 câu và lời giải chi tiết.","durationMinutes":120,"questions":[{"id":"q001","type":"short","text":"Cho các hợp chất hữu cơ: CH3COOH, HCOOCH3, C2H5OH. Ở điều kiện thường, có bao nhiêu chất là chất lỏng?","contentHtml":"<p>Cho các hợp chất hữu cơ: CH<sub>3</sub>COOH, HCOOCH<sub>3</sub>, C<sub>2</sub>H<sub>5</sub>OH. Ở điều kiện thường, có bao nhiêu chất là chất lỏng?</p>","answer":"3","aliases":[],"explanation":"Ở nhiệt độ phòng, acetic acid (CH₃COOH), methyl formate (HCOOCH₃) và ethanol (C₂H₅OH) đều tồn tại ở thể lỏng. Vì vậy có 3 chất."},{"id":"q002","type":"short","text":"Số nguyên tử hydrogen có trong phân tử oleic acid là?","contentHtml":"<p>Số nguyên tử hydrogen có trong phân tử oleic acid là?</p>","answer":"34","aliases":[],"explanation":"Oleic acid có công thức C₁₇H₃₃COOH, tức C₁₈H₃₄O₂. Chỉ số H trong công thức phân tử là 34."},{"id":"q003","type":"short","text":"Xà phòng hóa hoàn toàn trigliceride X trong dung dịch NaOH dư, thu được glycerol, sodium oleate, sodium stearate và sodium palmitate. Phân tử khối của X là bao nhiêu?","contentHtml":"<p>Xà phòng hóa hoàn toàn trigliceride X trong dung dịch NaOH dư, thu được glycerol, sodium oleate, sodium stearate và sodium palmitate. Phân tử khối của X là bao nhiêu?</p>","answer":"860","aliases":[],"explanation":"X gồm đúng một gốc oleate, một gốc stearate, một gốc palmitate gắn vào glycerol. M(X) = M(glycerol) + 282 + 284 + 256 − 3×18 = 92 + 822 − 54 = 860."},{"id":"q004","type":"short","text":"Đun 12 gam acetic acid với 13,8 gam ethanol (có H2SO4 đặc làm xúc tác) đến khi phản ứng đạt tới trạng thái cân bằng, thu được 11 gam ester. Hiệu suất của phản ứng ester hóa là bao nhiêu phần trăm?","contentHtml":"<p>Đun 12 gam acetic acid với 13,8 gam ethanol (có H<sub>2</sub>SO<sub>4</sub> đặc làm xúc tác) đến khi phản ứng đạt tới trạng thái cân bằng, thu được 11 gam ester. Hiệu suất của phản ứng ester hóa là bao nhiêu phần trăm?</p>","answer":"62,5","aliases":[],"explanation":"n(CH₃COOH) = 12/60 = 0,20 mol, n(ethanol) = 13,8/46 = 0,30 mol nên acid giới hạn. Ester lý thuyết: 0,20×88 = 17,6 g. Hiệu suất H = 11/17,6×100% = 62,5%."},{"id":"q005","type":"short","text":"Trong phân tử ester (X) no, đơn chức, mạch hở có thành phần oxygen chiếm 36,36 % khối lượng. Số đồng phân cấu tạo của X là bao nhiêu?","contentHtml":"<p>Trong phân tử ester (X) no, đơn chức, mạch hở có thành phần oxygen chiếm 36,36 % khối lượng. Số đồng phân cấu tạo của X là bao nhiêu?</p>","answer":"4","aliases":[],"explanation":"Ester no, đơn chức, hở: CₙH₂ₙO₂, M=14n+32. Do 32/M = 36,36% nên M=88, n=4. Các ester: HCOOCH₂CH₂CH₃, HCOOCH(CH₃)₂, CH₃COOC₂H₅ và C₂H₅COOCH₃; có 4 đồng phân."},{"id":"q006","type":"short","text":"Triolein là chất béo không no có công thức (C17H33COO)3C3H5. Số liên kết C=C có trong một phân tử triolein là?","contentHtml":"<p>Triolein là chất béo không no có công thức (C<sub>17</sub>H<sub>33</sub>COO)<sub>3</sub>C<sub>3</sub>H<sub>5</sub>. Số liên kết C=C có trong một phân tử triolein là?</p>","answer":"3","aliases":[],"explanation":"Triolein có 3 gốc oleate, mỗi gốc C₁₇H₃₃ có một liên kết đôi C=C. Tổng cộng 3 liên kết đôi."},{"id":"q007","type":"short","text":"Cho 1 mol chất béo X tác dụng với dung dịch NaOH dư, thu được 1 mol glycerol, 2 mol sodium palmitate và 1 mol sodium stearate. Số công thức cấu tạo phù hợp của X là bao nhiêu?","contentHtml":"<p>Cho 1 mol chất béo X tác dụng với dung dịch NaOH dư, thu được 1 mol glycerol, 2 mol sodium palmitate và 1 mol sodium stearate. Số công thức cấu tạo phù hợp của X là bao nhiêu?</p>","answer":"2","aliases":[],"explanation":"Ba vị trí của glycerol có hai gốc palmitate giống nhau và một gốc stearate. Gốc stearate ở carbon giữa hoặc ở carbon đầu/cuối (hai đầu tương đương khi chỉ xét cấu tạo), được 2 CTCT."},{"id":"q008","type":"short","text":"Đốt cháy hoàn toàn a gam triglycerid X cần vừa đủ 3,26 mol O2, thu được 2,28 mol CO2 và 39,6 gam H2O. Mặt khác, thủy phân hoàn toàn a gam X trong dung dịch NaOH, đun nóng, thu được dung dịch chứa b gam muối. Giá trị của b là bao nhiêu? (làm tròn kết quả đến chữ số thứ nhất sau dấu phẩy).","contentHtml":"<p>Đốt cháy hoàn toàn a gam triglycerid X cần vừa đủ 3,26 mol O<sub>2</sub>, thu được 2,28 mol CO<sub>2</sub> và 39,6 gam H<sub>2</sub>O. Mặt khác, thủy phân hoàn toàn a gam X trong dung dịch NaOH, đun nóng, thu được dung dịch chứa b gam muối. Giá trị của b là bao nhiêu? (làm tròn kết quả đến chữ số thứ nhất sau dấu phẩy).</p>","answer":"36,7","aliases":[],"explanation":"Bảo toàn khối lượng khi đốt: m(X)=2,28×44+2,2×18−3,26×32=35,6 g. Từ dữ kiện sản phẩm, lượng X phù hợp 0,04 mol tristearin (C₅₇H₁₁₀O₆). Xà phòng hóa tạo 3×0,04 mol sodium stearate, nên b=0,12×306=36,72≈36,7 g."},{"id":"q009","type":"short","text":"Số nguyên tử carbon trong một phân tử palmitic acid là?","contentHtml":"<p>Số nguyên tử carbon trong một phân tử palmitic acid là?</p>","answer":"16","aliases":[],"explanation":"Palmitic acid có công thức CH₃(CH₂)₁₄COOH, tương đương C₁₆H₃₂O₂. Vậy có 16 nguyên tử C."},{"id":"q010","type":"short","text":"Khi sử dụng xà phòng trong nước cứng, sẽ có phản ứng tạo thành kết tủa chứa calcium oleate ((C17H33COO)2Ca). Phân tử khối của calcium oleate là bao nhiêu?","contentHtml":"<p>Khi sử dụng xà phòng trong nước cứng, sẽ có phản ứng tạo thành kết tủa chứa calcium oleate ((C<sub>17</sub>H<sub>33</sub>COO)<sub>2</sub>Ca). Phân tử khối của calcium oleate là bao nhiêu?</p>","answer":"602","aliases":[],"explanation":"Calcium oleate có công thức (C₁₇H₃₃COO)₂Ca = C₃₆H₆₆O₄Ca. M = 36×12 + 66 + 4×16 + 40 = 602."},{"id":"q011","type":"short","text":"Đun nóng một loại mỡ động vật với dung dịch KOH, sản phẩm thu được có chứa muối potassium stearate (C17H35COOK). Phân tử khối của potassium stearate là bao nhiêu?","contentHtml":"<p>Đun nóng một loại mỡ động vật với dung dịch KOH, sản phẩm thu được có chứa muối potassium stearate (C<sub>17</sub>H<sub>35</sub>COOK). Phân tử khối của potassium stearate là bao nhiêu?</p>","answer":"322","aliases":[],"explanation":"Potassium stearate là C₁₇H₃₅COOK (C₁₈H₃₅O₂K). M=18×12+35+2×16+39=322."},{"id":"q012","type":"short","text":"Cho chất béo (triglyceride) X có công thức khung phân tử như sau: Cho 1 mol X cộng tối đa với bao nhiêu mol H2 (xt, t°, p)?","contentHtml":"<p>Cho chất béo (triglyceride) X có công thức khung phân tử như sau:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 12\" data-zoom=\"12:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRp4TAABXRUJQVlA4IJITAACwfgCdASrQAkYBPj0ejkUiIaERKJxsIAPEtLdymAi5HKvjq4HniU3QQ/jH+1dpn+D/JnxE/K/3P8zv7R7XGWfzPwL/i/2n+7/2j+9eiPe7+SfvXoEfi38b/rX5Q/0b079jxrnmBeo/1r/q/3Hx+tW7qg9wLgMP6nqC+SN/T//L/c+hv83/z//n/yfwGfz/+5f6X+/fkyHevhtujzXw23R5r4bbo818Nt0ea+G26PNfDbdHmvhtujzXw23R5r4bbo818Nt0ea+G26PNfDbcUBIMW626eG26PNfDbdHmvhtujzXw23R5p09vd5rVH+xGp8CwcwLoX9JXRr4bbo818Nt0ea+G26PNfDbdHVDoEY9HSohtujzXwv+NsnldKR3RDuTk7oh3I/hcHG1Is5E+1Ej/3BWSbyc24sjfamyzfBReb7dHmve+Ds3qPzVee7EO5OTuiHb/wmYvWUkF8T3jhfveMHNQK354EHP4V8NmG0h3Jyd0Q7k5OPpOTi/eLZNgS+TmHcnJxVDrCTiWj1ykO5OTuiHcnIrN6Gh8kXH6lrC4F7u9i8/9bluhvaXYEP0hKGtPNr4baYY+u9zDYGlp7sQ7k3aRCPO5WEtSFW5Vw23Q8bwLoe5aeqbgSQe/R5r4bbo8179+sTzNYaa9eE87i8sUJaekYUTqRJgaTeFssFfh6tGpx3Yh3Jyd0Q6h95xu9ffE0B9ZDAC9RZ9R7xuP90ea72b/zW+HsBp5C9Js6q+G26PNfDbTmgNaWJl6luTk7oc6V2HDb2HIJ2UKcfcI818Nt0ea97oZnYULB2z6dWS/dFQLVVNnA90+U/Y/DbdHlMAp1zq35LR5qFCcXQdpNoh3Jyd0Q6kdWSYNcPy/a1mfwdlPi5Lq4gXjxTt4oCSf/I6rKG26PNO3/+/q8/hBDuUBeYJae7EO36ExsvXRxgv1WAHf+wRCWnuxDuCD1sVqY8h2+cQFP5gCgp7y0SQ3wW/eOkL4KCJed9OKrP8Nk536MYnfCA6iXVjouTjulZBrz1sLrnp2/rgT8+6Ck4b7A0becjuVJd2d6OvbSOPQHp+GXObRswma2p2DZqDN49nwQ4qbxCTb/+caUpKMY2q+WZTnX//QOl6O1yaJcHOPMBvzJzi98k5EWOknZ/6SmpC3aq0ESKIIAVP/j1rLekKlp7lOd5t75loNtDSmc/Y6kRl+44akj1mnRyLMVycAo0di1A/U9x4xui1SuWLVo894OvtJPOp3Yh3JyedRTVW1Xxl5FcW6j2r  (d) Có thể dùng nước để phân biệt ester với alcohol hoặc với acid tạo nên chính ester đó. Có bao nhiêu phát biểu đúng?","contentHtml":"<p>Cho các phát biểu sau đây:</p><p class=\"qbullet\">(a) Các triglyceride đều có phản ứng cộng hydrogen.</p><p class=\"qbullet\">(b) Chỉ có các chất béo ở thể lỏng mới có phản ứng cộng hydrogen.</p><p class=\"qbullet\">(c) Các triglyceride có gốc acid béo no thường là chất rắn ở điều kiện thường.</p><p class=\"qbullet\">(d) Có thể dùng nước để phân biệt ester với alcohol hoặc với acid tạo nên chính ester đó.</p><p>Có bao nhiêu phát biểu đúng?</p>","answer":"2","aliases":[],"explanation":"(a) sai vì chất béo no không có C=C nên không cộng H₂; (b) sai vì khả năng cộng H₂ phụ thuộc liên kết C=C, không thể khẳng định chỉ chất béo lỏng mới có phản ứng này; (c) đúng vì chất béo có gốc acid béo no thường ở trạng thái rắn; (d) được xét đúng theo khả năng phân biệt nhờ tính tan của các chất nêu trong đề. Vậy có 2 phát biểu đúng."},{"id":"q014","type":"short","text":"Cho triolein lần lượt vào mỗi ống nghiệm chứa riêng biệt: Na, Cu(OH)2, CH3OH, nước Br2, dung dịch NaOH. Trong điều kiện thích hợp, số phản ứng xảy ra là bao nhiêu?","contentHtml":"<p>Cho triolein lần lượt vào mỗi ống nghiệm chứa riêng biệt: Na, Cu(OH)<sub>2</sub>, CH<sub>3</sub>OH, nước Br<sub>2</sub>, dung dịch NaOH. Trong điều kiện thích hợp, số phản ứng xảy ra là bao nhiêu?</p>","answer":"2","aliases":[],"explanation":"Triolein có C=C nên làm mất màu nước brom; có ba liên kết ester nên bị thủy phân bởi NaOH nóng. Triolein không có H linh động kiểu –OH nên không tác dụng trực tiếp với Na, không tạo phức với Cu(OH)₂. Theo phạm vi phản ứng được xét trong đề, có 2 phản ứng (Br₂, NaOH)."},{"id":"q015","type":"short","text":"Cho các phát biểu sau: (a) Xà phòng bị giảm hoặc mất tác dụng tẩy rửa khi dùng nước cứng vì tạo các muối kết tủa với cation Ca2+, Mg2+. (b) Bột giặt tổng hợp vẫn có thể sử dụng với nước cứng được vì muối sulfonate có độ tan lớn nên không bị kết tủa với ion Ca2+, Mg2+. (c) Các chế phẩm như bột giặt, kem giặt,… bao gồm các thành phần chất giặt rửa tổng hợp các phụ gia chất thơm, mất màu, còn có thể có chất tẩy trắng như sodium hypoclhorite. (d) Những chất giặt rửa tổng hợp có chứa gốc hydrocarbon phân nhánh không gây ô nhiễm môi trường vì chúng dễ bị các vi sinh vật phân hủy. (e) Chất ưa nước là những chất tan tốt trong dầu mỏ, alkane,… Có bao nhiêu phát biểu đúng?","contentHtml":"<p>Cho các phát biểu sau:</p><p class=\"qbullet\">(a) Xà phòng bị giảm hoặc mất tác dụng tẩy rửa khi dùng nước cứng vì tạo các muối kết tủa với cation Ca<sub>2</sub>+, Mg<sub>2</sub>+.</p><p class=\"qbullet\">(b) Bột giặt tổng hợp vẫn có thể sử dụng với nước cứng được vì muối sulfonate có độ tan lớn nên không bị kết tủa với ion Ca<sub>2</sub>+, Mg<sub>2</sub>+.</p><p class=\"qbullet\">(c) Các chế phẩm như bột giặt, kem giặt,… bao gồm các thành phần chất giặt rửa tổng hợp các phụ gia chất thơm, mất màu, còn có thể có chất tẩy trắng như sodium hypoclhorite.</p><p class=\"qbullet\">(d) Những chất giặt rửa tổng hợp có chứa gốc hydrocarbon phân nhánh không gây ô nhiễm môi trường vì chúng dễ bị các vi sinh vật phân hủy.</p><p class=\"qbullet\">(e) Chất ưa nước là những chất tan tốt trong dầu mỏ, alkane,…</p><p>Có bao nhiêu phát biểu đúng?</p>","answer":"3","aliases":[],"explanation":"Các ý đúng (a), (b), (c): nước cứng làm kết tủa xà phòng; chất giặt rửa sulfonate dùng được với nước cứng; bột giặt có thể chứa hương liệu/chất tẩy. (d) sai vì mạch phân nhánh thường khó phân hủy sinh học hơn; (e) sai vì ưa nước không đồng nghĩa tan tốt trong alkane. Có 3 ý đúng."},{"id":"q016","type":"short","text":"Thực hiện phản ứng ester hoá giữa HOOC-COOH với hỗn hợp CH3OH và C2H5OH thu được tối đa bao nhiêu ester hai chức?","contentHtml":"<p>Thực hiện phản ứng ester hoá giữa HOOC-COOH với hỗn hợp CH<sub>3</sub>OH và C<sub>2</sub>H<sub>5</sub>OH thu được tối đa bao nhiêu ester hai chức?</p>","answer":"3","aliases":[],"explanation":"Oxalic acid HOOC–COOH có hai nhóm –COOH tương đương. Gắn hai gốc methyl: dimethyl oxalate; hai gốc ethyl: diethyl oxalate; hoặc một methyl một ethyl: methyl ethyl oxalate. Tổng 3 diester."},{"id":"q017","type":"short","text":"Cho các phát biểu sau: (1) Một số ester có mùi thơm nên được dùng làm chất tạo hương trong công nghiệp thực phẩm và mĩ phẩm. (2) Chất béo là triester của glycerol với acid béo. (3) Chất béo tan tốt trong nước. (4) Mỡ động vật, dầu thực vật có thể được dùng làm nguyên liệu để sản xuất xà phòng. (5) Phản ứng thuỷ phân ester trong môi trường acid luôn là phản ứng một chiều. Có bao nhiêu phát biểu đúng?","contentHtml":"<p>Cho các phát biểu sau:</p><p class=\"qbullet\">(1) Một số ester có mùi thơm nên được dùng làm chất tạo hương trong công nghiệp thực phẩm và mĩ phẩm.</p><p class=\"qbullet\">(2) Chất béo là triester của glycerol với acid béo.</p><p class=\"qbullet\">(3) Chất béo tan tốt trong nước.</p><p class=\"qbullet\">(4) Mỡ động vật, dầu thực vật có thể được dùng làm nguyên liệu để sản xuất xà phòng.</p><p class=\"qbullet\">(5) Phản ứng thuỷ phân ester trong môi trường acid luôn là phản ứng một chiều.</p><p>Có bao nhiêu phát biểu đúng?</p>","answer":"3","aliases":[],"explanation":"Đúng các mệnh đề (1), (2), (4). (3) sai vì chất béo hầu như không tan trong nước; (5) sai vì thủy phân ester trong acid là phản ứng thuận nghịch. Có 3 mệnh đề đúng."},{"id":"q018","type":"short","text":"Từ các alcohol C3H8O và các acid C4H8O2 có thể tạo ra bao nhiêu ester là đồng phân cấu tạo của nhau?","contentHtml":"<p>Từ các alcohol C<sub>3</sub>H<sub>8</sub>O và các acid C<sub>4</sub>H<sub>8</sub>O<sub>2</sub> có thể tạo ra bao nhiêu ester là đồng phân cấu tạo của nhau?</p>","answer":"4","aliases":[],"explanation":"C₃H₈O có 2 alcohol cấu tạo (propan-1-ol, propan-2-ol). C₄H₈O₂ có 2 acid monocarboxylic no (butanoic, 2-methylpropanoic). Mỗi cặp tạo một ester riêng: 2×2=4."},{"id":"q019","type":"short","text":"Linoleic acid là acid béo thiết yếu cần thiết nhất trong cơ thể người do có thể bị chuyển hoá tạo ra nhiều acid béo omega-6 khác như arachidonic acid, docosatetraenoic acid,… Arachidonic acid chiếm khoảng 10 – 20% hàm lượng acid béo phospholipid trong cơ xương và có cấu tạo như sau: Tổng số các nguyên tử trong một phân tử arachidonic acid là bao nhiêu?","contentHtml":"<p>Linoleic acid là acid béo thiết yếu cần thiết nhất trong cơ thể người do có thể bị chuyển hoá tạo ra nhiều acid béo omega-6 khác như arachidonic acid, docosatetraenoic acid,… Arachidonic acid chiếm khoảng 10 – 20% hàm lượng acid béo phospholipid trong cơ xương và có cấu tạo như sau:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 19\" data-zoom=\"19:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRuYQAABXRUJQVlA4INoQAACwVgCdASqVA28APj0ejkQiIaGTWpSQIAPEtLdwt4cMNaEDwnn/DX8s/E38RfKn+5f1z9avxw9A/yD94/pv6+fjrzeeffMv+M/V/7N/Yf2L9Nv8t/QPxA9Afff/E/y38IvkC/C/4r/Yvxh/pv6r8aDin+O/vXqBerPzH+6f2b9xf8N+0vse6inp3qAfzT+1f7f8vv7Nzg1AL+if3v/i/5D8Zvoz/aP9f/kv85+0fsj/H/6z/r/8b/k//R/rP//+AX8Y/nf+V/uv+Q/4n9/////e+5b2UfrT7FP7Df/393iLqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqm7+itgwMy4SCwlcD1VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU3YMimEKJkx7yqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqdhX6Lu7u7u6IA+5H/HsXjgxZYjj/wF9dgZdsvnopgzJ/Vx1BLcHLVAr4i3faK7I7sNLy1JAUrvojG4991W+bJcXnweL7La2UGKk5zDR8cPm9HvkppSQKSa+ft+A6gksTWYLvX0aH29XkrHX/32JrSVxuX7PqHrfez4418TJAn4ZfLlOd/t+hDT4ADJeYjhED1WXuoZbHYFN9KhwdyEIdnF3fV3RWAoiiH/Kqlr/wotnbrBSdXqCjzQ8rM6Ew+3sDde5JesTr13US387yI58WJexN/7JJU26vU0LyPIg3650crdEYaBc1C47nttdMeXM8Gw4rI8liNrmeysu+YkknNwsTWD7k3A9UK+wVyGjMtY9RWHPKL6gGJz3kZJXU+2Ax+KGip3wggTDaaUmo7SaV1M8R/URcw+NERYROHf9tbaXj37OSf4K5T4ID8C/Ej34W/5FJpX/uuPpk8IpwdSrrAeqOkPZqRI70BJVFlv3m0R2ctfSupH+dJXpLE1mZgAAA/vkPgBR1lzH1nN8tq/lQlDH6CK+c3EDN6kPaNwpy7/BbbaaWY6Hxk5z8KYWTbcmhO8XUntd44HKGbvVF9LSMIYGujGXiaoxT6uo4aSiS8sZfdaYAGpAt4/0rTruu6X1au3uWHA51sVUhW2YteZtnEvWAACqSYtziR7nUbEOgKjujrDcR+6GHS3EO1TlJ7E7oY8jIZsFXA6vYgaMO+3vT0AAAI2NnRDvzH1EmDGety9w9VLnBjhko7B97bQJaCP8Kt6iNd+Qv+Dhdjq8sms7KcCNuz+ v>CH₂–OOC(CH₂)₁₄CH₃</div></div></div>\n<div class=\"chem-spec\"><strong>Chất Y</strong><div class=\"chem-structure\"><div>CH₂–OOC(CH₂)₁₄CH₃</div><div class=\"chem-bond\">│</div><div>CH–OOC(CH₂)₇CH=CH(CH₂)₇CH₃</div><div class=\"chem-bond\">│</div><div>CH₂–OOC(CH₂)₇CH=CHCH₂CH=CH(CH₂)₄CH₃</div></div></div></div>\n<p>Tổng số liên kết π trong phân tử X và Y là bao nhiêu?</p>","answer":"10","aliases":[],"explanation":"Mỗi triglyceride có 3 liên kết π thuộc ba nhóm C=O. Ở X có thêm 1 C=C, nên X có 4 π. Ở Y có thêm 3 C=C (1 gốc oleate và 2 ở gốc còn lại), nên Y có 6 π. Tổng 4+6=10."},{"id":"q022","type":"short","text":"Ester X đơn chức, mạch hở có tỉ khối so với oxygen bằng 2,75. Đun nóng 6,6 gam X với 52 gam dung dịch NaOH 10%, cô cạn dung dịch sau phản ứng thu được phần rắn có khối lượng 8,35 gam và phần hơi chứa alcohol Y. Tổng số nguyên tử trong phân tử Y là bao nhiêu?","contentHtml":"<p>Ester X đơn chức, mạch hở có tỉ khối so với oxygen bằng 2,75. Đun nóng 6,6 gam X với 52 gam dung dịch NaOH 10%, cô cạn dung dịch sau phản ứng thu được phần rắn có khối lượng 8,35 gam và phần hơi chứa alcohol Y. Tổng số nguyên tử trong phân tử Y là bao nhiêu?</p>","answer":"9","aliases":[],"explanation":"M(X)=2,75×32=88, n(X)=6,6/88=0,075 mol. NaOH đầu 5,2g=0,13mol; NaOH dư 0,055mol có khối lượng 2,2g. Muối khan có m=8,35−2,2=6,15g nên M(muối)=6,15/0,075=82, ứng với CH₃COONa. Y là C₂H₅OH (C₂H₆O), có 2+6+1=9 nguyên tử."},{"id":"q023","type":"short","text":"Cho các chất sau: Trong các chất trên, số chất thuộc loại acid béo omega-6 là bao nhiêu?","contentHtml":"<p>Cho các chất sau:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 23\" data-zoom=\"23:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRnQiAABXRUJQVlA4IGgiAACQtgCdASo7AvsAPj0ejUQiIaGUK1SwIAPEtLd3MDn88CFJ1mcz7UbxJ9APsT2g/IP5VM4fZ/qa/KvwJ+b/xP7X/2vmv9afqEfj39C/vv5Y/37k/gBfnn9i42fEB/n/EIUAfJF/z/L3+jf8H9rvgR/X7/eEi5xVGDSioaShvraPCDnHJQ1I4xa3ztFXlacwhfxPvBfC/D n tử C<sub>3</sub>H<sub>6</sub>O<sub>2</sub> là bao nhiêu?</p>","answer":"2","aliases":[],"explanation":"Hai ester C₃H₆O₂ là HCOOC₂H₅ (ethyl formate) và CH₃COOCH₃ (methyl acetate). Vậy 2 đồng phân."},{"id":"q025","type":"short","text":"Cho ba hợp chất butan-1-ol, propanoic acid, methyl acetate và các giá trị nhiệt độ sôi không theo thứ tự là: 57°C; 118°C; 141°C. Nhiệt độ sôi của methyl acetate là bao nhiêu?","contentHtml":"<p>Cho ba hợp chất butan-1-ol, propanoic acid, methyl acetate và các giá trị nhiệt độ sôi không theo thứ tự là: 57°C; 118°C; 141°C. Nhiệt độ sôi của methyl acetate là bao nhiêu?</p>","answer":"57","aliases":[],"explanation":"Methyl acetate là ester không cho liên kết hydrogen giữa các phân tử như alcohol/acid, nên có nhiệt độ sôi thấp nhất. Trong ba nhiệt độ 57°C, 118°C, 141°C, methyl acetate ứng với 57°C."},{"id":"q026","type":"short","text":"Hợp chất hữu cơ X có công thức phân tử trùng với công thức đơn giản nhất. Trong X, tỉ lệ khối lượng các nguyên tố là mC : mH : mO = 21 : 2 : 8. Tổng số nguyên tử trong công thức phân tử hợp chất X là bao nhiêu?","contentHtml":"<p>Hợp chất hữu cơ X có công thức phân tử trùng với công thức đơn giản nhất. Trong X, tỉ lệ khối lượng các nguyên tố là mC : mH : mO = 21 : 2 : 8. Tổng số nguyên tử trong công thức phân tử hợp chất X là bao nhiêu?</p>","answer":"17","aliases":[],"explanation":"Tỉ lệ mol C:H:O = 21/12 : 2/1 : 8/16 = 1,75 : 2 : 0,5 = 7 : 8 : 2. Công thức đơn giản C₇H₈O₂ cũng chính là CTPT. Tổng nguyên tử 7+8+2=17."},{"id":"q027","type":"short","text":"Cho ester đa chức X (có công thức phân tử C6H10O4) tác dụng với dung dịch NaOH, thu được sản phẩm gồm một muối của carboxylic acid Y và một alcohol Z. Biết X không có phản ứng tráng bạc. Số công thức cấu tạo phù hợp của X là bao nhiêu?","contentHtml":"<p>Cho ester đa chức X (có công thức phân tử C<sub>6</sub>H<sub>10</sub>O<sub>4</sub>) tác dụng với dung dịch NaOH, thu được sản phẩm gồm một muối của carboxylic acid Y và một alcohol Z. Biết X không có phản ứng tráng bạc. Số công thức cấu tạo phù hợp của X là bao nhiêu?</p>","answer":"4","aliases":[],"explanation":"X có hai nhóm ester (4 O), công thức C₆H₁₀O₄; khi xà phòng hóa chỉ thu một loại muối và một loại alcohol, đồng thời loại các ester formate có thể tráng bạc. Bốn cấu tạo là: dimethyl succinate; dimethyl 2-methylmalonate; diethyl oxalate; và ethylene glycol diacetate. Mỗi chất khi thủy phân tạo đúng một loại muối và một loại alcohol, đồng thời không có gốc formate gây phản ứng tráng bạc."},{"id":"q028","type":"short","text":"Để tác dụng hết với a mol triolein cần tối đa 0,6 mol Br2 trong dung dịch. Giá trị của a là bao nhiêu?","contentHtml":"<p>Để tác dụng hết với a mol triolein cần tối đa 0,6 mol Br<sub>2</sub> trong dung dịch. Giá trị của a là bao nhiêu?</p>","answer":"0,2","aliases":[],"explanation":"Mỗi mol triolein cộng tối đa 3 mol Br₂ (do có 3 C=C). Vậy 3a=0,6 ⇒ a=0,2 mol."},{"id":"q029","type":"short","text":"Thực hiện phản ứng ester hóa giữa 4,6 gam ethyl alcohol với lượng dư acetic acid, thu được 4,4 gam ester. Hiệu suất phản ứng ester hóa là?","contentHtml":"<p>Thực hiện phản ứng ester hóa giữa 4,6 gam ethyl alcohol với lượng dư acetic acid, thu được 4,4 gam ester. Hiệu suất phản ứng ester hóa là?</p>","answer":"50","aliases":[],"explanation":"n(ethanol)=4,6/46=0,10 mol. Ester ethyl acetate lý thuyết =0,10×88=8,8g. Hiệu suất H=4,4/8,8×100%=50%."},{"id":"q030","type":"short","text":"Hydrogen hoá hoàn toàn m gam triolein thì thu được 89 gam tristearin. Giá trị của m là bao nhiêu?","contentHtml":"<p>Hydrogen hoá hoàn toàn m gam triolein thì thu được 89 gam tristearin. Giá trị của m là bao nhiêu?</p>","answer":"88,4","aliases":[],"explanation":"Triolein có M=884; tristearin sau hydrogen hóa có M=890 (cộng thêm 3H₂). 89g tristearin =0,1mol, tương ứng 0,1mol triolein; m=0,1×884=88,4g."},{"id":"q031","type":"short","text":"Cho các phát biểu sau: a) Chất béo là triester của glycerol với các monocarboxylic acid có số chẵn nguyên tử carbon (12 – 24 nguyên tử C), mạch carbon dài, không phân nhánh. b) Lipid gồm chất béo, sáp, steroid, phospholipid,… c) Chất béo là các chất lỏng. d) Chất béo chứa chủ yếu các gốc không no của acid béo thường là chất lỏng ở nhiệt độ phòng và được gọi là dầu. e) Phản ứng thuỷ phân chất béo trong môi trường kiềm là phản ứng thuận nghịch. g) Chất béo là thành phần chính của dầu, mỡ động, thực vật. Có bao nhiêu phát biểu đúng?","contentHtml":"<p>Cho các phát biểu sau:</p>\n<p class=\"qbullet\">a) Chất béo là triester của glycerol với các monocarboxylic acid có số chẵn nguyên tử carbon (12 – 24 nguyên tử C), mạch carbon dài, không phân nhánh.</p>\n<p class=\"qbullet\">b) Lipid gồm chất béo, sáp, steroid, phospholipid,…</p>\n<p class=\"qbullet\">c) Chất béo là các chất lỏng.</p>\n<p class=\"qbullet\">d) Chất béo chứa chủ yếu các gốc không no của acid béo thường là chất lỏng ở nhiệt độ phòng và được gọi là dầu.</p>\n<p class=\"qbullet\">e) Phản ứng thuỷ phân chất béo trong môi trường kiềm là phản ứng thuận nghịch.</p>\n<p class=\"qbullet\">g) Chất béo là thành phần chính của dầu, mỡ động, thực vật.</p>\n<p>Có bao nhiêu phát biểu đúng?</p>","answer":"4","aliases":[],"explanation":"Theo hệ kiến thức của đề, các ý (a), (b), (d), (g) đúng; (c) sai vì chất béo có thể rắn hoặc lỏng; (e) sai vì xà phòng hóa trong kiềm được coi là phản ứng một chiều. Có 4 ý đúng."},{"id":"q032","type":"short","text":"Cho 0,1 mol tristearin ((C17H35COO)3C3H5) tác dụng hoàn toàn với dung dịch NaOH dư, đun nóng, thu được m gam glycerol. Giá trị của m là bao nhiêu?","contentHtml":"<p>Cho 0,1 mol tristearin ((C<sub>17</sub>H<sub>35</sub>COO)<sub>3</sub>C<sub>3</sub>H<sub>5</sub>) tác dụng hoàn toàn với dung dịch NaOH dư, đun nóng, thu được m gam glycerol. Giá trị của m là bao nhiêu?</p>","answer":"9,2","aliases":[],"explanation":"Phản ứng 1 mol tristearin → 1 mol glycerol. n(glycerol)=0,1mol; m=0,1×92=9,2g."},{"id":"q033","type":"short","text":"Cấu trúc của một loại triglyceride (X) được biểu diễn như sau: Khi thủy phân X trong môi trường acid, thu được sản phẩm có chứa acid béo omega-3 và omega- 9. Số nguyên tử hydrogen trong một phân tử acid béo omega-3 trên là bao nhiêu?","contentHtml":"<p>Cấu trúc của một loại triglyceride (X) được biểu diễn như sau:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 33\" data-zoom=\"33:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRs4mAABXRUJQVlA4IMImAAAQvQCdASrnAgsBPj0ejUQiIaGSmlUIIAPEtLd+H1yo4W9OejJSb87/4r8kvD/+5fkL/afU/8b+h/t/5F/3b9kfrU+9MR/o3+B5m/xz7Q/fv8V+y/97+d/9F3q/lfud/IL+Hfyj/B/kT/af3L+tR+U4F9m/vf/P8UvWJ8Z/6j3Af5V+4Hq/3n34X1Av6F/mf/X7G39t/7f9T+b3uG/MP9J/6v9X8BH86/u3/O/xX74/5rw/kZuqu+4S+VtxebswqY0Th0TEVww6JiK4YdExFcMOiYiuGHRMQTGcdeL0gvH2K19+bqrvzh0TEVww6JiK4YdExFcMOiYitnF4kSeyyh64iAkg43VXfnDomIrhh0TEVww6JiK4YJC0PtHUxTxX8YHot3rNWIZsJp9jeZTHj/BhjQ4LzY2uuqu/OHRIByiaHqsphrZYXRrrAt9RzreK+2QeD/pCrMA7l5u9co6mcdXyHOEYx5Ve5PWjpduNP8tXBBABwX4fhUm0awdsmhYqPhu5lu2UWz1DUcq8dY/bT95EAXTbSXralCpG05sgZMYm0++YNs2SpNHtlcEEAHBFIIpu+NZK+qgsVHw3dfOEbB8gc19UoOiPaac6WxfpAYLoN6TrsCaiZPQ0jqX+BcbZewq1KyWnv8Kop92TBqluSWs8rnQNQ9Vi4FRXZrNy0K/A2dE8Vjn1rpShY4YSWwS0L1ChxwEhxqYoJn9AsvHDYym6c/yk1c6nakZi+ZtSRS9MGBeTvobnEAiCbRk/z4M6MryWY+C3qpEucoRyov1ZfqEsFcgFLpGrx8m5KPzpXYFI/un8DkHt6diRbSLDaVxgZ6qRDZB3G6q784dExFcMSMMRXDDomBkDfGbATBhAEK1tHqVXqw4d+ra3Vhj6b7sb84dExFcMOiYiuGHRMRXDDomIrcqcn7MdSkS9njOBl2gwXJn9S511n1EKvyhe2eGPwbEGVOXYbEG68WzEVtil9qoQlkagKBX6IT8EU32RJcWQYhEHL1ZvmP7d3Huy6JMJyCxL1BOBggMFPlP9HCBbUJZcLGdrKLSSugUOkKMuki4xvc671Uz1SnLsxiRXTqE06Ui5dbxjJ48nrUrU0uGBn17kXuB0pmj7/LEpHfdmdyhufhlSiEPA2JIdj0BszW5j5z3gQje48ZbFTNOzj6VMnD/SoVqrnMlc8P0QPrYHRBYTgBXbxcF7ImEa3BqHK03UoXeVmS5v1WpdeBq6VEAcaIF9Fu2NxRjRcbctwRknTqapc91qGZRXWyOVatKPBXD2ZCIVGdnhxiLHCoTfLn9HwGoeTRUZa62w/ELSDzK3Gm06wmE70Z9LSzaZrIp7shaVoOgCDrzFO/nY5qyCopHBDyJ2wb+4ZkCYR6xqkkkFA0HTwVOFPJK1qe1XGcb469l5OVzO90soaZgzJi4tz5OJtnQgWYiuGHRMRXDDomIrhh0TEVwlZrF6JJ4PfGU+d4PwigJION1V35w6JiK4YdExFcMOiYhTMSVZag6bkHZdlwJ3O0JiD4jIci8Gm1ZXLrkDF1kGEAIxU6ZgcXgLLTI O₂. Vậy số nguyên tử H là 30."},{"id":"q034","type":"short","text":"Xà phòng hóa hoàn toàn 178 gam tristearin trong dung dịch KOH, thu được m gam potassium stearate. Giá trị của m là? (kết quả lấy giá trị phần nguyên).","contentHtml":"<p>Xà phòng hóa hoàn toàn 178 gam tristearin trong dung dịch KOH, thu được m gam potassium stearate. Giá trị của m là? (kết quả lấy giá trị phần nguyên).</p>","answer":"193","aliases":[],"explanation":"M(tristearin)=890, n=178/890=0,2mol. Mỗi mol cho 3mol potassium stearate, M=322. m=0,2×3×322=193,2g; lấy phần nguyên được 193."},{"id":"q035","type":"short","text":"Xà phòng hoá hoàn toàn 17,24 gam chất béo cần vừa đủ 0,06 mol NaOH. Cô cạn dung dịch sau phản ứng thu được khối lượng xà phòng là bao nhiêu gam? (làm tròn đáp án đến hàng phần mười).","contentHtml":"<p>Xà phòng hoá hoàn toàn 17,24 gam chất béo cần vừa đủ 0,06 mol NaOH. Cô cạn dung dịch sau phản ứng thu được khối lượng xà phòng là bao nhiêu gam? (làm tròn đáp án đến hàng phần mười).</p>","answer":"17,8","aliases":[],"explanation":"n(triglyceride)=0,06/3=0,02mol; glycerol tạo ra m=0,02×92=1,84g. Bảo toàn khối lượng phần hữu cơ: m(xà phòng)=17,24+0,06×40−1,84=17,80g."},{"id":"q036","type":"short","text":"Cho các nhận định về triolein: (1) ở thể lỏng; (2) nhẹ hơn nước; (3) tan tốt trong nước; (4) bị thủy phân trong môi trường kiềm. Có bao nhiêu nhận định đúng về triolein?","contentHtml":"<p>Cho các nhận định về triolein: (1) ở thể lỏng; (2) nhẹ hơn nước; (3) tan tốt trong nước; (4) bị thủy phân trong môi trường kiềm. Có bao nhiêu nhận định đúng về triolein?</p>","answer":"3","aliases":[],"explanation":"Triolein ở thể lỏng và nhẹ hơn nước: (1), (2) đúng. Triolein không tan tốt trong nước: (3) sai. Chứa nhóm ester nên xà phòng hóa với kiềm: (4) đúng. Tổng 3."},{"id":"q037","type":"short","text":"Catechin là một chất kháng oxi hoá mạnh, ức chế hoạt động của các gốc tự do nên có khả năng phòng chống bệnh ung thư, nhồi máu cơ tim. Trong lá chè tươi, catechin chiếm khoảng 25% đến 35% tổng trọng lượng. Công thức cấu tạo của catechin như hình dưới: Cho các phát biểu sau: (a) Catechin thuộc loại hợp chất hữu cơ tạp chức. (b) Catechin có khả năng phòng chống các bệnh ung thư, tim mạch. (c) Một phân tử catechin chứa 16 nguyên tử hydrogen. (d) Phân tử catechin có phản ứng vừa đủ với dung dịch NaOH theo tỉ lệ mol tương ứng là 1:3. Có bao nhiêu phát biểu đúng?","contentHtml":"<p>Catechin là một chất kháng oxi hoá mạnh, ức chế hoạt động của các gốc tự do nên có khả năng phòng chống bệnh ung thư, nhồi máu cơ tim. Trong lá chè tươi, catechin chiếm khoảng 25% đến 35% tổng trọng lượng. Công thức cấu tạo của catechin như hình dưới:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 37\" data-zoom=\"37:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRuQPAABXRUJQVlA4INgPAABQWQCdASqeAQMBPj0ejUSiIaGSGayUIAPEtLdwulCN+cz5f/x/bF/f/x086/xT5h+0fkZ/c/2V+LXIP1oajvyH7Yff/7b+7n9v94+/X4k6gv4x/Hf7v/Wv2Y/uPwkQSHBHq/9t/7n+Q8eXVuyA+BaoEeSN/m+Yf83/3PsHfzP+3/78WiP26SR+3SSP26SR+3SSP26SR+3SSP26SR+3SSP26SR+bo4VVzDNMR7lmMADar1s3cRJRfJH7dJI/bj1nhx2gVf/+9J6rlkl4yTd/YX2qTRdzxMKhNOyYbJRvobImZYBCO/pqP8nyR+3SSP2uxJxvWw0zJsHbgeCnwf498y/t9S/t0dAb+bpJCYYXRTt5TnoyADc3zJqxu3Mb+wHKpruF9S9saiLZYRKL9HB0LEfQDCXvyYKA+f1tgDLEI/xxtdVOUg3BUsH4QMEZb+YCdeDdxwqiqGnYaLSiKWD04zH/OvYqvB7LZNB7bNcTnCtRzQ/zpMHaRPrNfBa1O696ntpqsPPVzJzjpMfbLVAGdVzX69II1l67BVEh+oU5qgM4Ou8xKoRrzWLbg+T4Sv//a+iAXdkNmcMEqblp/QZPdoWS2eOEAF+3bbqdkqJ19vkQqkgjhxRzO4GA5+6q+hBszmWY2IOEqNZaqQ5vIpa2Nf2PvsL2HNqLxvnaP145XAJH8GEkft0YsgJuaevRveG78TlL6Y//Vxt8L74ySznKtpa6COrdI0Ho3AB9cDfoXb2wHlU3dr+3SSP26R4+ZY9ZcjyCx+Q1KUSVdEklbGf//1eQtnLXQMZUr1LW+u9JMTmc6fA8zzUQyt0ILKi2ORTxYz2P/IySoLlS/HUFpQXEgJH7dJI/aMklS3AT4A35UMMqTuSZMT7dI/bqxvEVFsciotF2txIN2nT1uehKozQQli8DxyKi2ORUWxyKi2ORUWxyKi2ORUWxyKi2ORUWxyKi2ORTgAA/v/QUAADZ3L/NeT6R8Yvx3thhz55HjrIQe3JEOye7hbR4ZZzVmxYGbeuC88yQu1avHLvnb+78NKclUNo6+UpPm1bfl+PyvnOTMzv0aDFn5zJpieLwYiIrzoIKaF7IqzX1weJQT+B7wde8nR8J1VAl9+IdJm/nOvIiA/LYjXxPSqA H/6pzjkKYn+5Q42nyfU9PcekwIUAI/UUzZBM0fHB0MwU3FW6nXVT63zUHsQ3tHy74KpF8VQc5/kyWoH3VOmlX9X5K48R/jOneviGftvqJW8qI8fZWF+tVoZ64ZlWE/CmMhoM6NhRht+BaeLSzdMfG0Abw9IBfB9rs444A0/J/FzRc/D723Ko+nAJ76Pad4H9rgdvjEDSsZempiFCvWxmvLtAft/zBfGhJcH0HJl+JLZbVElfdR7OuvFm4RudpubDW936hFx6AAAAAAA=\"/></figure><p> Cho các phát biểu sau:</p><p class=\"qbullet\">(a) Catechin thuộc loại hợp chất hữu cơ tạp chức.</p><p class=\"qbullet\">(b) Catechin có khả năng phòng chống các bệnh ung thư, tim mạch.</p><p class=\"qbullet\">(c) Một phân tử catechin chứa 16 nguyên tử hydrogen.</p><p class=\"qbullet\">(d) Phân tử catechin có phản ứng vừa đủ với dung dịch NaOH theo tỉ lệ mol tương ứng là 1:3.</p><p>Có bao nhiêu phát biểu đúng?</p>","answer":"2","aliases":[],"explanation":"Theo cấu tạo catechin: (a) đúng vì có nhiều nhóm chức khác nhau; (b) là công dụng được nêu trong dữ kiện; (c) sai vì catechin có CTPT C₁₅H₁₄O₆, chỉ có 14 H; (d) sai vì số nhóm phenol phản ứng với NaOH không phải 3. Có 2 ý đúng."},{"id":"q038","type":"short","text":"Chất X thỏa mãn các điều kiện sau: - Khi nhúng quỳ tím vào dung dịch chất X thấy quỳ chuyển màu đỏ. - X có phản ứng tráng bạc. Phân tử khối của X là bao nhiêu?","contentHtml":"<p>Chất X thỏa mãn các điều kiện sau:</p><p>- Khi nhúng quỳ tím vào dung dịch chất X thấy quỳ chuyển màu đỏ.</p><p>- X có phản ứng tráng bạc.</p><p>Phân tử khối của X là bao nhiêu?</p>","answer":"46","aliases":[],"explanation":"Dung dịch làm đỏ quỳ tím và có phản ứng tráng bạc phù hợp với formic acid HCOOH. M=12+2+2×16=46."},{"id":"q039","type":"short","text":"Thuỷ phân hoàn toàn m gam triglyceride X bằng 48 gam dung dịch NaOH 30% đun nóng (dùng dư 20% so với lượng lượng phản ứng), thu được glycerol và 89,0 gam hỗn hợp muối của acid béo. Khối lượng mol của X có giá trị bằng bao nhiêu?","contentHtml":"<p>Thuỷ phân hoàn toàn m gam triglyceride X bằng 48 gam dung dịch NaOH 30% đun nóng (dùng dư 20% so với lượng lượng phản ứng), thu được glycerol và 89,0 gam hỗn hợp muối của acid béo. Khối lượng mol của X có giá trị bằng bao nhiêu?</p>","answer":"862","aliases":[],"explanation":"m(NaOH ban đầu)=48×30%=14,4g. Dùng dư 20% ⇒ lượng phản ứng 14,4/1,2=12g=0,3mol; n(triglyceride)=0,1mol. Có 0,1mol glycerol (=9,2g). Bảo toàn khối lượng: m(X)=89+9,2−12=86,2g ⇒ M(X)=86,2/0,1=862."},{"id":"q040","type":"short","text":"Đun nóng acetic acid với isoamyl alcohol (CH3)2CHCH2CH2OH có H2SO4 đặc làm xúc tác thu được isoamyl acetate (dầu chuối). Biết hiệu suất phản ứng đạt 70%. Lượng dầu chuối thu được từ 132,35 gam acetic acid đun nóng với 200 gam isoamyl alcohol là bao nhiêu? (kết quả lấy giá trị phần nguyên).","contentHtml":"<p>Đun nóng acetic acid với isoamyl alcohol (CH<sub>3</sub>)<sub>2</sub>CHCH<sub>2</sub>CH<sub>2</sub>OH có H<sub>2</sub>SO<sub>4</sub> đặc làm xúc tác thu được isoamyl acetate (dầu chuối). Biết hiệu suất phản ứng đạt 70%. Lượng dầu chuối thu được từ 132,35 gam acetic acid đun nóng với 200 gam isoamyl alcohol là bao nhiêu? (kết quả lấy giá trị phần nguyên).</p>","answer":"200","aliases":[],"explanation":"M(acetic acid)=60; M(isoamyl alcohol)=88; M(isoamyl acetate)=130. n(acid)=132,35/60≈2,206mol; n(alcohol)=200/88≈2,273mol nên acid giới hạn. m(ester)=2,206×130×70%≈200,7g; theo cách lấy phần nguyên trong bảng, ghi 200g (nếu làm tròn số nguyên gần nhất là 201g)."},{"id":"q041","type":"short","text":"Để sản xuất 1 tấn xà phòng (có chứa 75% khối lượng là muối sodium của acid béo, còn lại là chất độn), người ta xà phòng hóa hoàn toàn m tấn chất béo trung tính bằng dung dịch chứa 120 kg NaOH vừa đủ. Xác định giá trị m. (Kết quả làm tròn đến hàng phần trăm).","contentHtml":"<p>Để sản xuất 1 tấn xà phòng (có chứa 75% khối lượng là muối sodium của acid béo, còn lại là chất độn), người ta xà phòng hóa hoàn toàn m tấn chất béo trung tính bằng dung dịch chứa 120 kg NaOH vừa đủ. Xác định giá trị m. (Kết quả làm tròn đến hàng phần trăm).</p>","answer":"0,72","aliases":[],"explanation":"Trong 1 tấn xà phòng có 750kg muối. 120kg NaOH=3kmol nên chất béo =1kmol và glycerol tạo ra 92kg. Bảo toàn khối lượng: m(chất béo)=750+92−120=722kg=0,722t ≈0,72t."},{"id":"q042","type":"short","text":"Acid béo omega-n là cách gọi phổ biến của các acid béo không no trong các thực phẩm dinh dưỡng. Trong đó n là vị trí xuất hiện liên kết đôi C=C đầu tiên trong mạch carbon (từ nhóm -CH3). Công thức khung phân tử của một acid béo không no được cho như sau: Giá trị n tương ứng với acid béo trên là bao nhiêu?","contentHtml":"<p>Acid béo omega-n là cách gọi phổ biến của các acid béo không no trong các thực phẩm dinh dưỡng. Trong đó n là vị trí xuất hiện liên kết đôi C=C đầu tiên trong mạch carbon (từ nhóm -CH<sub>3</sub>). Công thức khung phân tử của một acid béo không no được cho như sau:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 42\" data-zoom=\"42:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRkgNAABXRUJQVlA4IDwNAABwRwCdASprAmIAPj0ejUQiIaGTCvzYIAPEtLdwue8AD4AP0A17r3xCnVmFf6HPLb6BvNT/sB7yd429BbpZshl9Df5vtU/wfhr+H/Nv4z8n/WOxp9kOpH8i+1v5/8tPYnvt4Av5R/RP8zvmoAuru1ccF/9v8+/+R4O32j/bewB+pfVa/u/LT9Q/+f/S+uAP6RkiRgHGtQSMkSMA41qCRkiRgHGtQSMkSMA41qCRkiRgHGtMhfsx6EMS8XG2LZCG9sskWII52bmKdfRRdIl1+idqjVcXN2I8U04QvNuy0tvTDxw4q732D7BrLK8sLhMVfDjYM8YKeBNHPyVtJ94/bOnct7sMyuPj/sGRl3qK0+a4w6yBmKFtRQJwrL/l4KQ/R3V/XrqPVbcSvGQVuMcR08IDXzhnR6JpXvh7fVL2eEGE+YIAJyzsbS12EqGRSZ7u9oy3SVL2/Mn4QA7qBZPupJMtCA4qMKOQ6c0zmND1z3qrPXYSipEYQnM7Vi0/HqAczKLcUWuGsEzQCS3x/g4kUUu6wsK1FPcfGBj9RJBwPSB/JsTG1OMJjNscEmlo0VsD5ceHTRpjsjG6wg+ZiPLCX4tcHEjAcQDNXb9J2LMT5RA33yY52vG+F4s/CdoKRZe99VLGUlRl8cDK594TRXcHHh4EIwczzlWvlf4s4ch6d69nBM2rhna04UNB1X0+Rk8FcLoH+TT3LSzVeB8F5ircvw6CDg7Hh+xuspYMhxlDJEjAONagsV27xLOi1BIyRIwDjWoJGRoAAP78u6AAAYVRRj90BMd9dj6vd/qHwrizd6gk8LnEt4ORoG3sXY9kDn1PS5EEG78PCq5egHCa15703/yfGPp9pf0cvIEDj75BxI3kKPMnSrcZt4X2F3HYbW33lKUL3e7UODrUg8LUBuq0/jPpMFI1ebWD5LZdHI6spCPO+knQS0NGDDXlGN07tAmwjIu44xGIwyPnd4+pKULfkyYV9OmSHQOyvOp4p0vtFgsdBfqRMiNKEWb4GhGNOL7DiBqS1mzz5r2NWCS3mS5GXf/NJSQihJQh20N1QFj40j/Q1xAJwHy8eWTNo i chất béo trong dung dịch NaOH thu được sản phẩm là hỗn hợp của muối sodium palmitate (C<sub>15</sub>H<sub>31</sub>COONa) và sodium stearate (C<sub>17</sub>H<sub>35</sub>COONa) có tỉ lệ mol 1 : 2. Phân tử khối của loại chất béo trên là bao nhiêu?</p>","answer":"862","aliases":[],"explanation":"Mỗi triglyceride tạo ba muối với tỉ lệ palmitate:stearate=1:2, nên X là glycerol mono-palmitate di-stearate. M=92+256+2×284−3×18=862."},{"id":"q044","type":"short","text":"Cho dây các chất: vinyl acetate, benzyl acetate, phenyl acetate, methyl methacrylate, methyl acetate, ethyl formate, tripamitin. Có bao nhiêu chất trong dãy khi thủy phân trong dung dịch NaOH (dư), đun nóng sinh ra alcohol?","contentHtml":"<p>Cho dây các chất: vinyl acetate, benzyl acetate, phenyl acetate, methyl methacrylate, methyl acetate, ethyl formate, tripamitin. Có bao nhiêu chất trong dãy khi thủy phân trong dung dịch NaOH (dư), đun nóng sinh ra alcohol?</p>","answer":"5","aliases":[],"explanation":"Tạo alcohol khi xà phòng hóa: benzyl acetate → benzyl alcohol, methyl methacrylate → methanol, methyl acetate → methanol, ethyl formate → ethanol, tripalmitin → glycerol. Vinyl acetate tạo enol không bền chuyển thành aldehyde; phenyl acetate tạo phenolate. Tổng cộng 5."},{"id":"q045","type":"short","text":"Hỗn hợp X gồm hai ester có cùng công thức phân tử C8H8O2 và đều chứa vòng benzene. Để phản ứng hết với 0,25 mol X cần tối đa 0,35 mol NaOH trong dung dịch, thu được m gam hỗn hợp hai muối. Giá trị của m là bao nhiêu?","contentHtml":"<p>Hỗn hợp X gồm hai ester có cùng công thức phân tử C<sub>8</sub>H<sub>8</sub>O<sub>2</sub> và đều chứa vòng benzene. Để phản ứng hết với 0,25 mol X cần tối đa 0,35 mol NaOH trong dung dịch, thu được m gam hỗn hợp hai muối. Giá trị của m là bao nhiêu?</p>","answer":"30","aliases":[],"explanation":"Gọi x mol ester có nhóm phenoxy (tiêu thụ 2 mol NaOH/mol), số ester còn lại tiêu thụ 1 mol NaOH/mol. x+(0,25)=0,35 ⇒ x=0,10mol; loại còn lại 0,15mol. Để tạo đúng hai muối như dữ kiện, cặp phù hợp là ester cresyl formate và benzyl formate: tạo 0,25mol HCOONa (M68) và 0,10mol cresolate sodium (M130). m=0,25×68+0,10×130=30g."},{"id":"q046","type":"short","text":"Thuỷ phân hoàn toàn 8,8 gam ester X có công thức phân tử C4H8O2 trong 300 mL dung dịch NaOH 1 M thu được hỗn hợp hai chất hữu cơ Y và Z trong đó Y có tỉ khối hơi so với H2 là 16. Khối lượng chất rắn thu được khi cô cạn dung dịch sau phản ứng có giá trị là bao nhiêu?","contentHtml":"<p>Thuỷ phân hoàn toàn 8,8 gam ester X có công thức phân tử C<sub>4</sub>H<sub>8</sub>O<sub>2</sub> trong 300 mL dung dịch NaOH 1 M thu được hỗn hợp hai chất hữu cơ Y và Z trong đó Y có tỉ khối hơi so với H<sub>2</sub> là 16. Khối lượng chất rắn thu được khi cô cạn dung dịch sau phản ứng có giá trị là bao nhiêu?</p>","answer":"17,6","aliases":[],"explanation":"M(Y)=16×2=32 ⇒ Y là methanol, X là methyl propanoate; muối sodium propanoate M=96. n(X)=8,8/88=0,1mol, thu 9,6g muối. NaOH dùng 0,3mol, dư 0,2mol (=8g). Chất rắn khan =9,6+8=17,6g."},{"id":"q047","type":"short","text":"Xà phòng hóa hoàn toàn 27 gam aspirin (o-HOOC-C6H4-OOC-CH3) trong dung dịch KOH dư, thu được bao nhiêu gam muối? (kết quả làm tròn đến hàng phần mười).","contentHtml":"<p>Xà phòng hóa hoàn toàn 27 gam aspirin (o-HOOC-C<sub>6</sub>H<sub>4</sub>-OOC-CH<sub>3</sub>) trong dung dịch KOH dư, thu được bao nhiêu gam muối? (kết quả làm tròn đến hàng phần mười).</p>","answer":"46,8","aliases":[],"explanation":"Aspirin M=180; n=27/180=0,15mol. Trong KOH dư, mỗi mol aspirin tạo 1mol dipotassium salicylate (M214) và 1mol potassium acetate (M98). m(muối)=0,15×(214+98)=46,8g."},{"id":"q048","type":"short","text":"Methyl salicylate dùng làm thuốc xoa bóp giảm đau, được điều chế theo phản ứng sau: H 2 SO 4 , t o HOC6H4COOH + CH3OH HOC6H4COOCH3 + H2O Để sản xuất 3,8 triệu tuýp thuốc xoa bóp giảm đau cần tối thiểu m tấn salicylic acid. Biết mỗi tuýp thuốc chứa 2,7 gam methyl salicylate và hiệu suất phản ứng tính theo salicylic acid là 75%. Giá trị của m là bao nhiêu? (kết quả làm tròn đến giá trị hàng chục).","contentHtml":"<p>Methyl salicylate dùng làm thuốc xoa bóp giảm đau, được điều chế theo phản ứng sau:</p><div class=\"equation-scroll\"><div class=\"equation\">HOC₆H₄COOH + CH₃OH <span class=\"reaction-arrow\"><small>H₂SO₄ đặc, t°</small><span>⟶</span></span> HOC₆H₄COOCH₃ + H₂O</div></div><p>Để sản xuất 3,8 triệu tuýp thuốc xoa bóp giảm đau cần tối thiểu m tấn salicylic acid. Biết mỗi tuýp thuốc chứa 2,7 gam methyl salicylate và hiệu suất phản ứng tính theo salicylic acid là 75%. Giá trị của m là bao nhiêu? (kết quả làm tròn đến giá trị hàng chục).</p>","answer":"12,4","aliases":[],"explanation":"M(methyl salicylate)=152, M(salicylic acid)=138. Khối lượng ester cần: 3,8×10⁶×2,7g=10,26t. Với hiệu suất 75%, m(acid)=10,26×138/(152×0,75)≈12,42t ⇒ 12,4t theo đáp án."},{"id":"q049","type":"short","text":"Cho các thông tin trong bảng sau: Một nhóm học sinh tiến hành thí nghiệm điều chế xà phòng từ nguyên liệu ban đầu là mỡ lợn. Dựa vào thông tin ở bảng trên, nếu nhóm đã dùng là 500 gam mỡ lợn thì lượng NaOH cần lấy để xà phòng hóa hoàn toàn mỡ lợn là bao nhiêu? (kết quả làm tròn đến giá trị hàng chục).","contentHtml":"<p>Cho các thông tin trong bảng sau:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 49\" data-zoom=\"49:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRjRmAABXRUJQVlA4IChmAABQgAGdASpmAycBPj0ci0OiIaETKlZoIAPEs7do08qqdRqpXMPWjjgpw9TfjdgVtZcJvG8l7nHxH/paTv9bp892/6Hk7vlf9H1cf1z1Fv6t6KvTr5x/Mm/8XsU/pfpM+kt66vo8dNZ/kclJ63fkH7zPKD7/+RX9n9Kfxb5v+vf2r/J/4r+5f/T/OfI9/l+XDr//l+hX8b+xn2j+vf4z/T/4H90/vD/X/5P7lvVH45/3X+O/cP4Bfxr+Tf2z+y/3r/Wf3H98uTY3D/df9X1BfWL6P/oP8L/m//J/nPc1+J/5X+T9Zvz/+z/8L+7f5T5Af5b/Sf9p/ev3q/yv//+u/954mf5X/m+wP/Xf9T/8f9N7q/91/6f8//uP3L9/36B/nv/B/nP9R8in81/s/+1/w3+d/9/+t////oLug00KA9fgGLJ3ck9Fe31NBLl+kEM5fsdq75dJWRgr+3n5/xRFu1Yi4gzL6BdDaPIwfOS5Ns5+f8URbo468j61/Ns5+f7Blg2VAJitKzFkv8URbtX7XVUQyKQx/vwEjenMPsMIiP9T+/pXKOIE m – COO –. (3) Ester no, đơn chức, mạch hở có CTPT là CnH2nO2, với n ≥ 2. (4) Hợp chất CH3COOC2H5 thuộc loại ester. (5) Sản phẩm của phản ứng giữa acid hữu cơ và alcohol là ester. Có bao nhiêu phát biểu đúng?","contentHtml":"<p>Có các nhận định sau:</p><p class=\"qbullet\">(1) Ester là sản phẩm của phản ứng giữa acid và glycerol.</p><p class=\"qbullet\">(2) Ester là hợp chất hữu cơ trong phân tử có nhóm – COO –.</p><p class=\"qbullet\">(3) Ester no, đơn chức, mạch hở có CTPT là CnH<sub>2</sub>nO<sub>2</sub>, với n ≥ 2.</p><p class=\"qbullet\">(4) Hợp chất CH<sub>3</sub>COOC<sub>2</sub>H<sub>5</sub> thuộc loại ester.</p><p class=\"qbullet\">(5) Sản phẩm của phản ứng giữa acid hữu cơ và alcohol là ester.</p><p>Có bao nhiêu phát biểu đúng?</p>","answer":"3","aliases":[],"explanation":"Theo cách phân loại ester trong chương trình: (2) đúng (nhóm –COO–), (3) đúng (ester no đơn chức hở có CₙH₂ₙO₂), (4) đúng (ethyl acetate); (1) sai vì glycerol không phải alcohol duy nhất tạo ester, (5) phát biểu quá rộng, thiếu điều kiện phản ứng. Có 3 nhận định đúng."},{"id":"q055","type":"short","text":"Cho các chất (1), (2), (3) có cấu tạo như sau: 1) Cả ba chất (1), (2), (3) đều có tính chất giặt rửa nên chúng được dùng làm xà phòng. 2) Khi dùng để giặt rửa, chất (2) có thể bị phân hủy sinh học nên ít gây ô nhiễm môi trường. 3) Khi dùng để giặt rửa, chất (1) và (3) khó bị phân hủy sinh học nên gây ô nhiễm môi trường. 4) Tác dụng giặt rửa của các chất (1), (2), (3) đều không bị ảnh hưởng khi sử dụng chúng để giặt rửa trong nước cứng. 5) Trong công nghiệp, cả ba chất trên đều có thể được sản xuất từ nguyên liệu là dầu mỏ. Liệt kê các phát biểu đúng theo số thứ tự tăng dần.","contentHtml":"<p>Cho các chất (1), (2), (3) có cấu tạo như sau:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 55\" data-zoom=\"55:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRugpAABXRUJQVlA4INwpAAAwvACdASpVA+8APj0ejUSiIaESiQTQIAPEtLd fQFOd/3+RMy+PMMymnF0TUO3ifMCCdGsFeVK2/ue2jZz+2izmLXQOcGNhx64ir+mi7XgPYakrS6OT+6OLq/LPUH0dPQHT51ljikMFqfUTE6dWcn+mc4pPIPSsHGx56StBstQmeImD9iZ2Dz2m0eZx8dnqr0GLTmbUj3pZ8y6GWhn2O1E5LE5f5XvoP3Oz/WCL9i4ldkoVShpumVh2jBfrH7L0LXe764KPOai+YwtPFkUZ0XPHPQ4tBAAAAAA=\"/></figure><p class=\"qbullet\">1) Cả ba chất (1), (2), (3) đều có tính chất giặt rửa nên chúng được dùng làm xà phòng.</p><p class=\"qbullet\">2) Khi dùng để giặt rửa, chất (2) có thể bị phân hủy sinh học nên ít gây ô nhiễm môi trường.</p><p class=\"qbullet\">3) Khi dùng để giặt rửa, chất (1) và (3) khó bị phân hủy sinh học nên gây ô nhiễm môi trường.</p><p class=\"qbullet\">4) Tác dụng giặt rửa của các chất (1), (2), (3) đều không bị ảnh hưởng khi sử dụng chúng để giặt rửa trong nước cứng.</p><p class=\"qbullet\">5) Trong công nghiệp, cả ba chất trên đều có thể được sản xuất từ nguyên liệu là dầu mỏ.</p><p>Liệt kê các phát biểu đúng theo số thứ tự tăng dần.</p>","answer":"25","aliases":[],"explanation":"Đúng các ý (2) và (5), viết liền thành “25”. (2) là muối carboxylate mạch thẳng, có khả năng bị phân hủy sinh học; (5) nói về khả năng dùng dầu mỏ làm nguyên liệu công nghiệp. (1) sai vì chất (1),(3) là chất giặt rửa tổng hợp, không gọi là xà phòng; (3) không thể kết luận mọi chất (1),(3) đều khó phân hủy; (4) sai vì xà phòng (2) bị giảm tác dụng trong nước cứng."},{"id":"q056","type":"short","text":"Vinyl acetate là một monomer quan trọng để sản xuất polymer trong công nghiệp dệt may, hoá chất, dược phẩm, chất dẻo, cao su. Quá trình điều chế vinyl acetate trong công nghiệp từ ethylene được thực hiện với sự có mặt của kim loại Pd như sau: CH3COOH + CH2=CH2 + ½O2 → CH3COOCH=CH2 + H2O Biết hiệu suất chuyển hoá ethylene thành vinyl acetate đạt 80%. Khối lượng vinyl acetate điều chế được từ 2,8 tấn ethylene là bao nhiêu?","contentHtml":"<p>Vinyl acetate là một monomer quan trọng để sản xuất polymer trong công nghiệp dệt may, hoá chất, dược phẩm, chất dẻo, cao su. Quá trình điều chế vinyl acetate trong công nghiệp từ ethylene được thực hiện với sự có mặt của kim loại Pd như sau:</p><p>CH<sub>3</sub>COOH + CH<sub>2</sub>=CH<sub>2</sub> + ½O<sub>2</sub> → CH<sub>3</sub>COOCH=CH<sub>2</sub> + H<sub>2</sub>O</p><p>Biết hiệu suất chuyển hoá ethylene thành vinyl acetate đạt 80%. Khối lượng vinyl acetate điều chế được từ 2,8 tấn ethylene là bao nhiêu?</p>","answer":"6,88","aliases":[],"explanation":"Phương trình cho tỉ lệ ethylene:vinyl acetate =1:1. M(C₂H₄)=28; M(vinyl acetate)=86. 2,8t ethylene tạo lý thuyết 2,8×86/28=8,6t; thực tế đạt 80% là 8,6×0,8=6,88t."},{"id":"q057","type":"short","text":"Trong thành phần của một số loại dầu thực vật như dầu hạt lanh, dầu đậu nành hoặc dầu hướng dương, có chứa ester của các acid không no linolenic acid (X), linoleic acid (Y) với glycerol (A). Số liên kết π trong triester X2YA là bao nhiêu?","contentHtml":"<p>Trong thành phần của một số loại dầu thực vật như dầu hạt lanh, dầu đậu nành hoặc dầu hướng dương, có chứa ester của các acid không no linolenic acid (X), linoleic acid (Y) với glycerol (A). Số liên kết π trong triester X<sub>2</sub>YA là bao nhiêu?</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 57\" data-zoom=\"57:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRsAjAABXRUJQVlA4ILQjAABQpACdASqWA9oAPj0cjUUiIaERCMzUIAPEtLdwup8Z+s5MA1f4mvt8m3oXs2dr5zedvKa4f/x/5kf4734eofzAP1k/x3UA8wH6x/8D/OeyR/uf7t7jv1u/ID5Bf6B/bvVQ/unsGftl7An6zerP/r/2++Cb9x/3P+A79dP+vrPXjb+mfjx5lfzz+1f3f9dfxt9v/w75D+tf1P+7/5L+/ftX8RGSPrQ/yvQr+MfW78N/e/2s/rftN/of6d4r/i/6z/zf7z+xfwC/if8b/sH9o/XT+8/tD9LnoP/D7lTZv9N6AvrF9D/x/+C/dD++enF/CeovzS+4D/Qf73/vfzL5iKgH+qP+/7IH9H/7P8x+VXun/Lf8z/4P9B8Bn8u/q/+f/v/+S/7/+F//4pM47LKjWORUaxyKjWORUaxyKjWORUaxyKc3AsWK0efTJYHiN83SSP26SR+3SSP26SR+3SSP26SR+3SSP26SP3BQJuutxd31tCXHZZUaxyKjWORUaxyKjWORUaxyKjWORUaxx41g8IMgA39j61F9l128EsjbC0IoCLIwth1ZomM94W8RM4qR1zjBHJTeNfgb3Xo6epHX0EscOXsoRukpJEmK44cEe7ZcuUxoAwzrD/6lwfmPbSNRjUKesh0mZxz7cnSyZSXgzPZglFieb36sIXovqDIdhhVggzkrnmMop4Rb êu? Biết lượng KOH cần để xà phòng hóa hoàn toàn 1 gam chất béo là 198 mg.","contentHtml":"<p>Một nhóm học sinh đã tiến hành thí nghiệm điều chế “xà phòng handmade” từ nguyên liệu ban đầu là NaOH và mỡ lợn. Nhóm đã dùng 560 gam mỡ lợn và lấy một lượng NaOH cần dùng là m gam rồi tiến hành xà phòng hóa hoàn toàn lượng mỡ lợn trên. Giá trị của m là bao nhiêu? Biết lượng KOH cần để xà phòng hóa hoàn toàn 1 gam chất béo là 198 mg.</p>","answer":"79,2","aliases":[],"explanation":"Chỉ số xà phòng hóa tương ứng KOH: 560×198mg=110,88g KOH. Để thay bằng NaOH cùng số mol: m(NaOH)=110,88×40/56=79,2g."},{"id":"q059","type":"short","text":"Methyl 4-hydroxybenzoate là ester được sử dụng làm chất bảo quản thực phẩm hoặc mĩ phẩm để ngăn chặn sự phát triển của nấm mốc, vi khuẩn có hại. Thuỷ phân methyl 4-hydroxybenzoate trong môi trường acid thu được chất hữu cơ X và một alcohol. Phân tử khối của X bằng bao nhiêu?","contentHtml":"<p>Methyl 4-hydroxybenzoate là ester được sử dụng làm chất bảo quản thực phẩm hoặc mĩ phẩm để ngăn chặn sự phát triển của nấm mốc, vi khuẩn có hại. Thuỷ phân methyl 4-hydroxybenzoate trong môi trường acid thu được chất hữu cơ X và một alcohol. Phân tử khối của X bằng bao nhiêu?</p>","answer":"138","aliases":[],"explanation":"Thủy phân methyl 4-hydroxybenzoate trong acid tạo 4-hydroxybenzoic acid HOC₆H₄COOH (C₇H₆O₃). M=7×12+6+3×16=138."},{"id":"q060","type":"short","text":"Cho sơ đồ phản ứng: ⎯⎯⎯→+ NaOHo ⎯⎯⎯⎯⎯→+ AgNOo 3 /NH 3 ⎯⎯⎯→+ NaOHo Ester X (C4HnO2) t Y t Z t C2H3O2Na. Xác định giá trị của n là?","contentHtml":"<p>Cho sơ đồ phản ứng:</p><div class=\"reaction-chain\"><span>Ester X (C₄HₙO₂)</span><span class=\"reaction-arrow\"><small>+ NaOH, t°</small><span>⟶</span></span><span>Y</span><span class=\"reaction-arrow\"><small>+ AgNO₃/NH₃, t°</small><span>⟶</span></span><span>Z</span><span class=\"reaction-arrow\"><small>+ NaOH, t°</small><span>⟶</span></span><span>C₂H₃O₂Na</span></div><p>Xác định giá trị của n là?</p>","answer":"6","aliases":[],"explanation":"Ester X là vinyl acetate CH₃COOCH=CH₂, công thức C₄H₆O₂. Khi thủy phân kiềm tạo sản phẩm từ vinyl alcohol chuyển hóa thành acetaldehyde; aldehyde tham gia phản ứng tráng bạc rồi tạo acetate. Vậy n=6."},{"id":"q061","type":"short","text":"Cho 13,6 gam phenyl acetate tác dụng với 200 mL dung dịch NaOH 1,5 M đun nóng. Sau khi phản ứng xảy ra hoàn toàn thu được dung dịch X. Cô cạn X thu được a gam chất rắn khan. Giá trị của a là bao nhiêu?","contentHtml":"<p>Cho 13,6 gam phenyl acetate tác dụng với 200 mL dung dịch NaOH 1,5 M đun nóng. Sau khi phản ứng xảy ra hoàn toàn thu được dung dịch X. Cô cạn X thu được a gam chất rắn khan. Giá trị của a là bao nhiêu?</p>","answer":"23,8","aliases":[],"explanation":"Phenyl acetate M136 nên n=13,6/136=0,1mol. Mỗi mol dùng 2mol NaOH, tạo 0,1mol CH₃COONa (8,2g) và 0,1mol C₆H₅ONa (11,6g). NaOH đầu 0,3mol, dư 0,1mol (=4g). Tổng rắn=8,2+11,6+4=23,8g."},{"id":"q062","type":"short","text":"Ester X được tạo thành từ ethylene glycol và hai carboxylic acid đơn chức. Trong phân tử ester, số nguyên tử carbon nhiều hơn số nguyên tử oxygen là 1. Khi cho m gam X tác dụng với dung dịch NaOH (dư) thì lượng NaOH đã phản ứng là 10 gam. Giá trị của m là bao nhiêu?","contentHtml":"<p>Ester X được tạo thành từ ethylene glycol và hai carboxylic acid đơn chức. Trong phân tử ester, số nguyên tử carbon nhiều hơn số nguyên tử oxygen là 1. Khi cho m gam X tác dụng với dung dịch NaOH (dư) thì lượng NaOH đã phản ứng là 10 gam. Giá trị của m là bao nhiêu?</p>","answer":"16,5","aliases":[],"explanation":"Diester của ethylene glycol luôn có 4 O. Số C nhiều hơn O đúng 1 nên X có 5 C: CH₃COOCH₂CH₂OOCH (một gốc acetate, một gốc formate), công thức C₅H₈O₄, M132. 10g NaOH=0,25mol; mỗi mol X dùng 2mol NaOH nên nX=0,125mol, m=16,5g."},{"id":"q063","type":"short","text":"Hợp chất E được điều chế từ alcohol X và acid Y (biết Y là hợp chất tạp chức chứa vòng benzene). E có trong thành phần của một số thuốc giảm đau, xoa bóp, cao dán, dùng để điều trị đau lưng, căng cơ, bong gân. Thành phần về khối lượng các nguyên tố trong E như sau: 63,16%C, 5,26%H và 31,58%O. Phổ IR của E ngoài vùng hấp thụ với peak đặc trưng của liên kết C=O (số sóng 1750- 1735 cm-1), liên kết C-O (số sóng 1300-1000 cm-1) còn có peak đặc trưng của liên kết O-H (số sóng 3650 - 3200 cm-1). Từ phổ MS, xác định được E có phân tử khối là 152. Cho các phát biểu sau: (1) X là methyl alcohol. (2) Tổng số nguyên tử trong phân tử E là 20. (3) Y có nhóm -OH và -COOH. (4) 1 mol Y tác dụng vừa đủ với 2 mol NaOH. Có bao nhiêu phát biểu đúng?","contentHtml":"<p>Hợp chất E được điều chế từ alcohol X và acid Y (biết Y là hợp chất tạp chức chứa vòng benzene). E có trong thành phần của một số thuốc giảm đau, xoa bóp, cao dán, dùng để điều trị đau lưng, căng cơ, bong gân. Thành phần về khối lượng các nguyên tố trong E như sau: 63,16%C, 5,26%H và 31,58%O. Phổ IR của E ngoài vùng hấp thụ với peak đặc trưng của liên kết C=O (số sóng 1750- 1735 cm-1), liên kết C-O (số sóng 1300-1000 cm-1) còn có peak đặc trưng của liên kết O-H (số sóng 3650 - 3200 cm-1). Từ phổ MS, xác định được E có phân tử khối là 152. Cho các phát biểu sau:</p><p class=\"qbullet\">(1) X là methyl alcohol.</p><p class=\"qbullet\">(2) Tổng số nguyên tử trong phân tử E là 20.</p><p class=\"qbullet\">(3) Y có nhóm -OH và -COOH.</p><p class=\"qbullet\">(4) 1 mol Y tác dụng vừa đủ với 2 mol NaOH.</p><p>Có bao nhiêu phát biểu đúng?</p>","answer":"3","aliases":[],"explanation":"% nguyên tố và M=152 cho CTPT E=C₈H₈O₃, phù hợp methyl salicylate (ester của methanol và salicylic acid). (1) đúng, (2) sai vì tổng nguyên tử=8+8+3=19, (3) đúng vì acid Y có –OH phenol và –COOH, (4) đúng vì 1mol salicylic acid có thể phản ứng với 2mol NaOH. Tổng 3."},{"id":"q064","type":"short","text":"Điều chế ethyl acetate trong phỏng thí nghiệm được tiến hành như sau: Cho khoảng 2 mL ethanol và 2 mL acetic acid tuyệt đối vào ống nghiệm, lắc đều hỗn hợp. - Thêm khoảng 1 mL dung dịch H2SO4 đặc, lắc nhẹ để các chất trộn đều với nhau. - Kẹp ống nghiệm vào kẹp gỗ rồi đặt ống nghiệm vào cốc nước nóng (khoảng 60°C – 70°C) trong khoảng 5 phút, thỉnh thoảng lắc đều hỗn hợp. Sau đó lấy ống nghiệm ra khỏi cốc nước nóng, để nguội hỗn hợp rồi rót sang ống nghiệm khác chứa 5 mL dung dịch muối ăn bão hòa thì thấy chất lỏng trong ống nghiệm tách thành hai lớp, lớp trên có mùi thơm đặc trưng. Phản ứng xảy ra trong thí nghiệm theo phương trình hoá học sau : CH3COOH + C2H5OH ⇋ CH3COOC2H5 + H2O (1); Kc = 4 Ghi phổ hồng ngoại của hai chất tham gia phản ứng trong 2 hình không tương ứng dưới đây: Hình 1: Hình 2: Cho biết số sóng hấp thụ đặc trưng của một số liên kết trên phổ hồng ngoại như sau: C=O (ester, carboxylic Liên kết O-H (alcohol) O-H (carboxylic acid) C-O (ester) acid) Số sóng (cm-1) 3650 - 3200 3300 - 2500 1780 - 1650 1300 - 1000 Ban đầu, các chất phản ứng được lấy với số mol bằng nhau, chưa có sản phẩm sinh ra, khi phản ứng (1) đạt đến trạng thái cân bằng thì % số mol C2H5OH bị ester hoá là bao nhiêu? (kết quả làm tròn đến giá trị hàng chục).","contentHtml":"<p>Điều chế ethyl acetate trong phòng thí nghiệm được tiến hành như sau:</p>\n<p>Cho khoảng 2 mL ethanol và 2 mL acetic acid tuyệt đối vào ống nghiệm, lắc đều hỗn hợp.</p>\n<p>– Thêm khoảng 1 mL dung dịch H<sub>2</sub>SO<sub>4</sub> đặc, lắc nhẹ để các chất trộn đều với nhau.</p>\n<p>– Kẹp ống nghiệm vào kẹp gỗ rồi đặt ống nghiệm vào cốc nước nóng (khoảng 60°C – 70°C) trong khoảng 5 phút, thỉnh thoảng lắc đều hỗn hợp. Sau đó lấy ống nghiệm ra khỏi cốc nước nóng, để nguội hỗn hợp rồi rót sang ống nghiệm khác chứa 5 mL dung dịch muối ăn bão hòa thì thấy chất lỏng trong ống nghiệm tách thành hai lớp, lớp trên có mùi thơm đặc trưng.</p>\n<p>Phản ứng xảy ra trong thí nghiệm theo phương trình:</p>\n<div class=\"chem-equation-wrap\"><div class=\"chem-equation\"><span>CH<sub>3</sub>COOH + C<sub>2</sub>H<sub>5</sub>OH</span><span class=\"reaction-step\"><span class=\"reaction-arrow\">⇌</span></span><span>CH<sub>3</sub>COOC<sub>2</sub>H<sub>5</sub> + H<sub>2</sub>O</span></div>  trưng của một số liên kết trên phổ hồng ngoại:</p><div class=\"table-scroll\"><table><thead><tr><th>Liên kết</th><th>O–H (alcohol)</th><th>O–H (carboxylic acid)</th><th>C=O (ester/acid)</th><th>C–O (ester)</th></tr></thead><tbody><tr><td>Số sóng (cm⁻¹)</td><td>3650–3200</td><td>3300–2500</td><td>1780–1650</td><td>1300–1000</td></tr></tbody></table></div>\n<p>Ban đầu, các chất phản ứng được lấy với số mol bằng nhau, chưa có sản phẩm sinh ra. Khi phản ứng đạt cân bằng thì bao nhiêu phần trăm số mol C<sub>2</sub>H<sub>5</sub>OH bị ester hóa? (Làm tròn đến hàng chục.)</p>","answer":"66,7","aliases":[],"explanation":"Gọi n là số mol ban đầu của mỗi chất, x là số mol đã phản ứng. Kc=[ester][nước]/([acid][ethanol])=x²/(n−x)²=4. Suy ra x/(n−x)=2 ⇒ 3x=2n ⇒ x/n=2/3≈66,7%."},{"id":"q065","type":"short","text":"Methyl butanoate là một ester có mùi táo. Khi đun nóng hỗn hợp 17,6 gam butanoic acid và 4,8 gam methyl alcohol với xúc tác H2SO4 đặc, thu được m gam methyl butanoate. Biết hiệu suất phản ứng đạt 75%. Giá trị của m là? (kết quả làm tròn đến giá trị hàng chục).","contentHtml":"<p>Methyl butanoate là một ester có mùi táo. Khi đun nóng hỗn hợp 17,6 gam butanoic acid và 4,8 gam methyl alcohol với xúc tác H<sub>2</sub>SO<sub>4</sub> đặc, thu được m gam methyl butanoate. Biết hiệu suất phản ứng đạt 75%. Giá trị của m là? (kết quả làm tròn đến giá trị hàng chục).</p>","answer":"11,5","aliases":[],"explanation":"n(butanoic acid)=17,6/88=0,2mol; n(methanol)=4,8/32=0,15mol, nên methanol giới hạn. M(methyl butanoate)=102. m=0,15×102×75%=11,475≈11,5g."},{"id":"q066","type":"short","text":"Sử dụng 1 tạ chất béo trung tính chứa 65% tristearin, còn lại là tripalmitin về khối lượng để sản xuất xà phòng. Loại xà phòng tạo ra này chứa 72% là muối potassium của acid béo, còn lại là các chất phụ gia như: tạo màu, tạo hương thơm, tạo bọt, tạo độ rắn…. Biết mỗi bánh xà phòng nặng 150 gam. Số bánh xà phòng thu được bao nhiêu?","contentHtml":"<p>Sử dụng 1 tạ chất béo trung tính chứa 65% tristearin, còn lại là tripalmitin về khối lượng để sản xuất xà phòng. Loại xà phòng tạo ra này chứa 72% là muối potassium của acid béo, còn lại là các chất phụ gia như: tạo màu, tạo hương thơm, tạo bọt, tạo độ rắn…. Biết mỗi bánh xà phòng nặng 150 gam. Số bánh xà phòng thu được bao nhiêu?</p>","answer":"1008","aliases":[],"explanation":"100kg gồm 65kg tristearin (M890) và 35kg tripalmitin (M806). Muối potassium thu từ chúng có khối lượng: (65/890)×3×322+(35/806)×3×294≈108,87kg. Mỗi bánh 150g chứa 72% muối (=0,108kg). Số bánh≈108,87/0,108≈1008."},{"id":"q067","type":"short","text":"Một nhóm học sinh thực hiện đề tài tách curcumin từ củ nghệ. Curcumin là hợp chất tạo màu vàng đặc trưng cho củ nghệ, được biết đến với tác dụng chống viêm, chống oxi hóa và có tiềm năng nghiên cứu ứng dụng trong điều trị ung thư, Alzheimer, bệnh tim mạch. Công thức cấu tạo của curcumin như sau: Số nguyên tử hydrogen trong phân tử curcumin là bao nhiêu?","contentHtml":"<p>Một nhóm học sinh thực hiện đề tài tách curcumin từ củ nghệ. Curcumin là hợp chất tạo màu vàng đặc trưng cho củ nghệ, được biết đến với tác dụng chống viêm, chống oxi hóa và có tiềm năng nghiên cứu ứng dụng trong điều trị ung thư, Alzheimer, bệnh tim mạch. Công thức cấu tạo của curcumin như sau:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 67\" data-zoom=\"67:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRuYjAABXRUJQVlA4INojAACwngCdASp/A8sAPj0ejESiIaGR2YysIAPEs7dyqAipHIzX9A7Wj2g2Du9flh7Nti9tXnr6I8p/w/83/yv5l/3T56+gDzAP1a/1v5h9ovzAfyb+wf9P/R+0p+pvuX/Wz9Vf9V8gH8s/rPrAf7f2CP209gP+Uf1z/xey9/p/2z/8PyT/tX+2HwD/zX+9f9n8//kA///qAf//rd+on9Z/I/zJ/nv9p/sP9s/t/40+2f4d8k/XP6j+yXrZY5+sfUj+MfY/77/dv24/tXt5/wvyA83/yT9y/6HqC/iP8f/rH9W/Xf+zft/9K/yPaZ67/rP9P/ZvYF9ZfpX+d/xP+H/brnb8QL9eP+dxvtAT9Uep9/Of+//Oejz8q/0f/t/0n+k+Q/+Z/2z/a/nX/if/+Lft3ybCyqsA+3fJrHd03EIVv3DrmuzsQrYrMpM0VnfUkFhY0WyqsA+3fJsLKqwD7d8mwsqrAPt3yaxszzmybWl16meMyblBIqgjKldu+TYWVVgH275NhZVWAfbvk2FlVYB huốc điều trị ghẻ, chấy và được điều chế từ alcohol và carboxylic acid tương ứng. Để sản xuất 2,5 triệu lọ thuốc trị ghẻ cần tối thiểu m tấn benzoic acid. Biết mỗi lọ thuốc chứa 3,2 gam benzyl benzoate và hiệu suất phản ứng là 80%. Giá trị của m là bao nhiêu?","contentHtml":"<p>Benzyl benzoate được sử dụng làm thuốc điều trị ghẻ, chấy và được điều chế từ alcohol và carboxylic acid tương ứng. Để sản xuất 2,5 triệu lọ thuốc trị ghẻ cần tối thiểu m tấn benzoic acid. Biết mỗi lọ thuốc chứa 3,2 gam benzyl benzoate và hiệu suất phản ứng là 80%. Giá trị của m là bao nhiêu?</p>","answer":"5,75","aliases":[],"explanation":"Cần 2,5×10⁶×3,2g=8t benzyl benzoate (M212). Benzoic acid M122, tỉ lệ phản ứng 1:1. Với hiệu suất 80%: m(acid)=8×122/(212×0,8)≈5,75t."},{"id":"q069","type":"short","text":"Rutin có nhiều trong hoa hoè còn được gọi là vitamin P. Rutin có công thức cấu tạo như hình dưới: Khối lượng rutin thành phẩm có độ tinh khiết 94,10% thu được bằng phương pháp chiết dùng nước nóng từ 300 kg nụ hoa hòe khô (có 28,9% rutin về khối lượng), với hiệu suất của quá trình chiết đạt 11,29% là bao nhiêu kg? (kết quả làm tròn đến hàng phần mười).","contentHtml":"<p>Rutin có nhiều trong hoa hoè còn được gọi là vitamin P. Rutin có công thức cấu tạo như hình dưới:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 69\" data-zoom=\"69:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRigkAABXRUJQVlA4IBwkAABw+wCdASpCAl8CPj0ejkSiIaGR2xR4IAPEtLdwuOdKuUXdj459p+tD4h/jH0P96/u3+R/13969y3R36f/gf97/K+pP8h+9P6b+5+n3hz8vv9f1C/yL+Zf4/+9fj9x8ABP0XvZtb/3mzd8ZCdQ/2/Ol+c/739o/cy/sgnhCqIPg1OGXj5C4ZePkLhnJMjAFXvhcmPkLhl4+QuGXj5C4ZeSsE6Fwy8fIXDLx8hcMvHyFxnTDXPkLhl4+QuGXj5C4ZePkQS8UCFUQfBqcMvHyFwy8fIXDbMABgpx8hcMvHyFwy8fIXDLx8iCXigQqiD4NThl4+QuGXj37I5Fcr3p6couGXj5C4ZePfq4VM2ct5oqKGgOvcD2rEe9jm+nxOk6+YuTD0BAAZbx8hcMvHyFwy8fkXA9zh1anDirl71oLrVmEEZSmfMVgvJ1Kbhl4+QuGXj5C4ZeCKblbwNXy+0ZYsqFAj5ED0lTZmghVECRfTkATdnDLx7+zlwBTlMZrqAA7Y2chEXl2G á trình chiết đạt 11,29% là bao nhiêu kg? (kết quả làm tròn đến hàng phần mười).</p>","answer":"10,4","aliases":[],"explanation":"Rutin có sẵn trong 300kg hoa hòe: 300×0,289=86,7kg. Hiệu suất chiết 11,29% cho 86,7×0,1129=9,788kg rutin tinh khiết. Thành phẩm tinh khiết 94,10% có m=9,788/0,941≈10,4kg."},{"id":"q070","type":"short","text":"X là ester tạo từ acid đơn chức và alcohol 2 chức. X không tác dụng với Na. Thuỷ phân hoàn toàn 0,1 mol X bằng NaOH (vừa đủ) thu được hỗn hợp sản phẩm có tổng khối lượng là 21,2 gam. Hãy cho biết có nhiêu ester thoả mãn điều kiện đó?","contentHtml":"<p>X là ester tạo từ acid đơn chức và alcohol 2 chức. X không tác dụng với Na. Thuỷ phân hoàn toàn 0,1 mol X bằng NaOH (vừa đủ) thu được hỗn hợp sản phẩm có tổng khối lượng là 21,2 gam. Hãy cho biết có nhiêu ester thoả mãn điều kiện đó?</p>","answer":"3","aliases":[],"explanation":"Ester hoàn toàn của alcohol hai chức với acid đơn chức cần 2mol NaOH/mol ester. Với 0,1mol X: m(NaOH)=0,2×40=8g; tổng sản phẩm 21,2g, nên m(X)=13,2g ⇒ M(X)=132 (CTPT C₅H₈O₄). Các cấu tạo phù hợp: ethylene glycol ester hóa với formic và acetic acid; propane-1,2-diol diformate; propane-1,3-diol diformate. Có 3."},{"id":"q071","type":"short","text":"Rutin có nhiều trong hoa hoè. Rutin có tác dụng làm bền vững thành mạch, chống co thắt, chống phóng xạ tia X, chống viêm cầu thận cấp. Rutin có có công thức cấu tạo như hình dưới: Trong thực tiễn có hai phương pháp tách rutin từ hoa hoè như sau : Phương pháp 1: Hoa hoè xử lí bằng dung dịch sodium hydroxide. Lọc, acid hoá phần nước lọc, thu được rutin. Phương pháp 2: Chiết rutin từ hoa hoè bằng nước nóng sau đó để nguội, rutin sẽ tách ra. Một qui trình chiết xuất rutin từ hoa hòe tươi được thực hiện như sau: 500 gam hoa hòe tươi (sấy khô (lượng nước hao hụt 80%) → hoa hòe khô (chiết xuất theo phương pháp 1) → rutin. Biết hiệu suất của quá trình chiết xuất rutin theo phương pháp 1 đạt 20%, hoa hòe chứa 26% rutin. Khối lượng của rutin thu được sau khi chiết xuất là bao nhiêu gam?","contentHtml":"<p>Rutin có nhiều trong hoa hoè. Rutin có tác dụng làm bền vững thành mạch, chống co thắt, chống phóng xạ tia X, chống viêm cầu thận cấp. Rutin có công thức cấu tạo như hình dưới:</p>\n<figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 71\" data-zoom=\"71:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRowqAABXRUJQVlA4IIAqAAAwvACdASpoAlUBPj0cjEUiIaER6CzIIAPEtLd+EOygpZyZR0sCv7L/afxz/H/2v/DvmH6l/bP2C/tX/u/2fxfaM+zD/R9C/479jPtv96/bj+2ful8ef8n/A/tx50/EP+w9Qj8V/kf9m/r37Bf3b9s+SW1b/d/9v1BfWX6B/qP8L+UPpm6mXhH9efgB/nv91/53sV3yVAr+k/671R/6//5f7D0u/l/+g/9P+h+BD+X/2r/e/4z99P7r//xkQEqOQXzUtPb3/RTCEwtiYe7QEqOQXzUtPgn1Q+faH8UcgvmpafBRUMSBUZ+MMIBnPAWI44tKKwbGHQzJQ1LT4KVDZVDJ3loJdTKhkIAFUEKyuoawy1CTIda39qM6l7Y7uQXzUtPgpUNlUMhASo5BfNQ1GpKR92XNkmFW7rnQ9mU7UoIkOVAlSRdTKhkICVHIL5qWnwUo/+vt9vE0VG4vVbLO4HkzuzdBw00aP94N3R3JN16D3nf/1ztw3R8E+3whWa5EaP8gvmpafBSobKoZCAlHvRgEPZ31lCM56+NHi7/IBu5XtnA7QkYhHzUtPgpUNd/rIMqO1G/RpJxWFDaK8+p8FKKHdJ2KuWsDJyGkZW+8sQgBXBbeVaEBFnTwJuSqPcgm8o6Gz/owz7KJFkwnfnpdL+vNHF7T/JAf53FOUJva7ezZqKHblfJ+jT7/WORUb7LP0o8qD6T1g6QaI7YIaWnvK+bjrYPD8oTGrEms/JN1/dQW5S2PzdLTvDhf4aWjn3q9hgMbdQmmqom6vYg8lrE3Lz+0e1R6sgf/MT/1RhDeizaWsYXQHcN3PaX7f/qa1ZgyB6uIWlrBcn6WpW54sbD9xjbtdGrb9n4BtCDXoLWlMVqeLduz9H62JYIg0kK16OMICRVn/mtGucM0+p1lmMU5r9UNimTgwL5qG0YqHaZUfUP0jTidtXSMvd0ZirQaOqowlzuRB2DYvvHor2iZ/56YHD3WxKcAv9LAucOA5PO2GPYymulP1bOZFuoxl6Na0wLwEimURBcbXZKjjuQEQ6kdi5Kp3hmo1U+ClQIX+Uk6f/bP8HtbRD84u/o+f2b88vkdnomEmAX54h2wHgFMH62qzGJS+p/wivA+XP5GmDqe9fNWPeoyktM49LrfZ7eNHdQoftMoH0iN+6mC5JJ7etD/Kj0isYM3d0b6/4YLP13wiIguplQyAXXvjVS0+ClQRBIqep8thPVEGw9YL7J3BzawVfTLXRvDXwBSZYMp5Y3YxMgDwuV3wlGbCYcxEXUn1g59J8RbOw9wfhKOhY/ZSo5BfNQ3iQHeHa3iE+If3s3oRH1q8Wlmp7A/vgrnc//35D/uzksgSSk6tJbKtBbXO5v/2fv/+0cD+ZpweX8KfYvlM/SOa+z//gJVj7OdTfvZiFFiJkLLn5yXIsfeNC16zfcArg5nkuQy/BdwFdF3HGVtSBOEBKNyP0l8XKm8J1W5a+dWmCpir+2kXroAyEMlt39hryA8OB/moiXmRq/9DjrTWJwMKtkQtVXwAEdrZZGNT0Y2Q8CRguSnEER5FIzPcZlmCj5j5WykF2DqPV39knNTODQ c/nDl/unoMe2jfmlClY7DvqGfgjJ8FXmFSHehXLPvqQQRfwLRT8ohgucYt1rTxBam2sxgt8UgNLboBMStHRsQUu1ii3AREqaih4mSLu+5xYVs0/GOurR+FpcAu20PyEPNMy9PAdUT6IWlNzlP2+DUSKZaRN5sSfLFnS88bS/+uJnpj4HfFckR1beB8kiWVZNtxPEdQF3bl5CWt17yNtp51ZbgQDd1OTsiMiNdQoSJCiWMm0YIdZpy6iwVqyWAFshUQiOGGk34IZejNMMgNNMKsZBquF7EcugZnDopzoSY1wyPb+aFENHyT2Cag+Ok/usY5v9Z9BE0PDZYgngGiJju1WYcU0MAAhtTlIaOdsLKYNn2y8BkOGdWAPu8VLmiZHce7h7F5PmMr/IckYVjWlcimbDiNqo5R4LhgTPBiAGznkqTcW+IeVpIw4NPJgr1E9p279hoTD1s6gybmk33Bl0qeC4HQ73Pz5KBraAhJxryPnPU9jwYHI9nVZu4R341pDVj8oYK3vdZBA8cYE8AP2kdTuhIjZP/i/9XkOIzCR3UXUF7jg38JajRD6xLQdNxfFAVOb3TdgodS0r9j9QOX4UUMrqHoqSLGhLcBIHfsQRovNXYiZJSY1XMhGoS2SPzN0gBQe7mKb0KrnBXmm66YyaTAWwf2f7Eq3EISn2jb8kXWAANWAEZop/2U3pwvnUPiFr5kyJQG1lPg6IjDMJqIuQ2sl7bt1VN9YcPlArpPWMOgHF4tpl6UeylOs5TVdMoA9g+PmFmDEu13e+9WIPC/BDj04YO2gElTGI6pGDzowXjovNztiRXApm7D0dro2qFK+QPTOpdHTSdVpX8NHjddxNP64xHuHThnp5ToCIPHaUlrM3k5Y1aBQm2bA3bPwgoP3UgiZ3mViNPgRn2DiXX8fiTWg04EKAAAAAAAA==\"/></figure>\n<p>Trong thực tiễn có hai phương pháp tách rutin từ hoa hoè:</p>\n<p><b>Phương pháp 1:</b> Hoa hoè xử lí bằng dung dịch sodium hydroxide. Lọc, acid hoá phần nước lọc, thu được rutin.</p>\n<p><b>Phương pháp 2:</b> Chiết rutin từ hoa hoè bằng nước nóng, sau đó để nguội, rutin sẽ tách ra.</p>\n<p>Một quy trình chiết xuất rutin từ hoa hòe tươi được thực hiện như sau:</p>\n<div class=\"chem-equation-wrap\"><div class=\"chem-equation\"><span>500 gam hoa hòe tươi</span><span class=\"reaction-step\"><span class=\"reaction-cond\">sấy khô, hao hụt 80% nước</span><span class=\"reaction-arrow\">⟶</span></span><span>hoa hòe khô</span><span class=\"reaction-step\"><span class=\"reaction-cond\">chiết xuất theo phương pháp 1</span><span class=\"reaction-arrow\">⟶</span></span><span>rutin</span></div></div>\n<p>Biết hiệu suất của quá trình chiết xuất rutin theo phương pháp 1 đạt 20%, hoa hòe chứa 26% rutin. Khối lượng của rutin thu được sau khi chiết xuất là bao nhiêu gam?</p>","answer":"5,2","aliases":["5,2"],"explanation":"500 g hoa tươi mất 80% khối lượng khi sấy, còn 100 g hoa khô. Lượng rutin lý thuyết = 100×26% = 26 g. Hiệu suất chiết 20% nên thu được 26×20%=5,2 g."},{"id":"q072","type":"short","text":"Thuốc aspirin thuộc nhóm thuốc kháng viêm non-steroid, có tác dụng giảm đau, hạ sốt. Thuốc aspirin được tổng hợp từ các nguyên liệu là salicylic acid và acetic anhydride theo phương trình hóa học sau (hiệu suất phản ứng tính theo salicylic acid là 92%: o-HO–C6H4–COOH + (CH3CO)2O → o-CH3COO–C6H4–COOH + CH3COOH Để sản xuất một lô thuốc aspirin gồm 12 triệu viên nén (mỗi viên chứa 81 mg aspirin) thì khối lượng salicylic acid cần dùng bằng bao nhiêu kg? (làm tròn kết quả đến hàng đơn vị).","contentHtml":"<p>Thuốc aspirin thuộc nhóm thuốc kháng viêm non-steroid, có tác dụng giảm đau, hạ sốt. Thuốc aspirin được tổng hợp từ các nguyên liệu là salicylic acid và acetic anhydride theo phương trình hóa học sau (hiệu suất phản ứng tính theo salicylic acid là 92%:</p><p>o-HO–C<sub>6</sub>H<sub>4</sub>–COOH + (CH<sub>3</sub>CO)<sub>2</sub>O → o-CH<sub>3</sub>COO–C<sub>6</sub>H<sub>4</sub>–COOH + CH<sub>3</sub>COOH</p><p>Để sản xuất một lô thuốc aspirin gồm 12 triệu viên nén (mỗi viên chứa 81 mg aspirin) thì khối lượng salicylic acid cần dùng bằng bao nhiêu kg? (làm tròn kết quả đến hàng đơn vị).</p>","answer":"810","aliases":[],"explanation":"Khối lượng aspirin cần sản xuất: 12×10⁶×81mg=972kg. Tỉ lệ salicylic acid:aspirin =1:1 (M=138 và 180). Hiệu suất 92% nên m(acid)=972×138/(180×0,92)=810kg."},{"id":"q073","type":"short","text":"Để điều chế isoamyl acetate trong phòng thí nghiệm, một học sinh đã đun nóng 4,0 mL acetic acid (D = 1,05 g/mL) với 8,0 mL isoamyl alcohol (CH3)2CHCH2CH2OH (D = 0,81 g/mL), có dung dịch H2SO4 đặc làm xúc tác, thu được 5,2 mL isoamyl acetate (D = 0,88 g/mL). Hiệu suất phản ứng là y %. Hãy xác định giá trị của y (làm tròn đến giá trị hàng chục).","contentHtml":"<p>Để điều chế isoamyl acetate trong phòng thí nghiệm, một học sinh đã đun nóng 4,0 mL acetic acid (D = 1,05 g/mL) với 8,0 mL isoamyl alcohol (CH<sub>3</sub>)<sub>2</sub>CHCH<sub>2</sub>CH<sub>2</sub>OH (D = 0,81 g/mL), có dung dịch H<sub>2</sub>SO<sub>4</sub> đặc làm xúc tác, thu được 5,2 mL isoamyl acetate (D = 0,88 g/mL). Hiệu suất phản ứng là y %. Hãy xác định giá trị của y (làm tròn đến giá trị hàng chục).</p>","answer":"50,3","aliases":[],"explanation":"m(acid)=4×1,05=4,2g →n=0,07mol; m(alcohol)=8×0,81=6,48g →n≈0,0736mol. Acid giới hạn; ester tối đa=0,07×130=9,1g. Ester thực tế=5,2×0,88=4,576g; H=4,576/9,1×100%≈50,3%."},{"id":"q074","type":"short","text":"Thành phần chủ yếu của xà phòng thường là muối sodium của palmitic acid hoặc stearic acid. Ngoài ra, trong xà phòng còn có chất độn (làm tăng độ cứng để đúc thành bánh), chất tẩy màu, chất diệt khuẩn và chất tạo hương.Từ 3,5 tấn chất béo chứa 80% khối lượng tristearin (còn 20% tạp chất trơ bị loại bỏ trong quá trình nấu xà phòng) để sản xuất được m tấn xà phòng chứa 70% khối lượng sodium stearate. Giả sử hiệu suất toàn bộ quá trình là 90%. Giá trị của m bằng bao nhiêu tấn? (kết quả làm tròn đến chữ số hàng phần trăm).","contentHtml":"<p>Thành phần chủ yếu của xà phòng thường là muối sodium của palmitic acid hoặc stearic acid. Ngoài ra, trong xà phòng còn có chất độn (làm tăng độ cứng để đúc thành bánh), chất tẩy màu, chất diệt khuẩn và chất tạo hương.Từ 3,5 tấn chất béo chứa 80% khối lượng tristearin (còn 20% tạp chất trơ bị loại bỏ trong quá trình nấu xà phòng) để sản xuất được m tấn xà phòng chứa 70% khối lượng sodium stearate. Giả sử hiệu suất toàn bộ quá trình là 90%. Giá trị của m bằng bao nhiêu tấn? (kết quả làm tròn đến chữ số hàng phần trăm).</p>","answer":"3,71","aliases":[],"explanation":"Khối lượng tristearin nguyên chất: 3,5×80%=2,8t. 1mol tristearin (M890) tạo 3mol sodium stearate (3×306). Muối thực tế=2,8×918/890×90%≈2,600t. Xà phòng chứa 70% muối nên m≈2,600/0,70≈3,71t."},{"id":"q075","type":"short","text":"Cho sơ đồ phản ứng theo đúng tỉ lệ mol: X + 2NaOH → X1 + X2 + X3 X1 + HCl → X4 + NaCl X2 + HCl → X5 + NaCl X3 + CuO → X6 + Cu + H2O Biết X có công thức phân tử C6H10O4 và chứa hai chức ester; X1, X2 đều có hai nguyên tử carbon trong phân tử và khối lượng mol của X1 nhỏ hơn khối lượng mol của X2. Phân tử khối của X4 là bao nhiêu?","contentHtml":"<p>Cho sơ đồ phản ứng theo đúng tỉ lệ mol:</p><div class=\"equation-scroll\"><div class=\"equation\">X + 2NaOH → X₁ + X₂ + X₃</div><div class=\"equation\">X₁ + HCl → X₄ + NaCl</div><div class=\"equation\">X₂ + HCl → X₅ + NaCl</div><div class=\"equation\">X₃ + CuO → X₆ + Cu + H₂O</div></div><p>Biết X có công thức phân tử C₆H₁₀O₄ và chứa hai chức ester; X₁, X₂ đều có hai nguyên tử carbon trong phân tử và khối lượng mol của X₁ nhỏ hơn khối lượng mol của X₂. Phân tử khối của X₄ là bao nhiêu?</p>","answer":"60","aliases":[],"explanation":"X chứa hai nhóm ester; sau phản ứng kiềm thu hai muối X₁, X₂ mỗi chất có 2 carbon, và một alcohol X₃. Muối có M nhỏ hơn là CH₃COONa (M82); acid tương ứng X₄ là CH₃COOH, M=60."},{"id":"q076","type":"short","text":"Omega-3 là một loại acid béo mang lại nhiều lợi ích cho sức khỏe con người như thanh lọc máu, ngăn ngừa sự lão hóa ở não bộ, phát triển thị lực. Có ba loại acid béo omega-3 chính là DHA, EPA và ALA. Có thể bổ sung omega-3 cho cơ thể bằng cách sử dụng dầu cá. Một loại dầu cá có hàm lượng 1000mg/viên; mỗi viên chứa 300mg Omega-3 (180 mg EPA, 120mg DHA). EPA có công thức khung phân tử như sau: 1000 lọ dầu cá (loại 60 viên/lọ) chứa bao nhiêu kg EPA (kết quả làm tròn đến hàng phần mười)?","contentHtml":"<p>Omega-3 là một loại acid béo mang lại nhiều lợi ích cho sức khỏe con người như thanh lọc máu, ngăn ngừa sự lão hóa ở não bộ, phát triển thị lực. Có ba loại acid béo omega-3 chính là DHA, EPA và ALA. Có thể bổ sung omega-3 cho cơ thể bằng cách sử dụng dầu cá. Một loại dầu cá có hàm lượng 1000mg/viên; mỗi viên chứa 300mg Omega-3 (180 mg EPA, 120mg DHA). EPA có công thức khung phân tử như sau:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 76\" ,"type":"short","text":"Thuốc Ritalin là chất kích thích hệ thần kinh trung ương được sử dụng phổ biến nhất trong điều trị rối loạn tăng động, giảm chú ý và chứng ngủ rũ. Mỗi viên thuốc ritalin chứa 10 mg methylphenidate hydrochloride được điều chế theo sơ đồ hình dưới: Để sản xuất 3 triệu hộp thuốc ritalin loại 20 viên/hộp với hiệu suất là 78% tính theo ritalinic acid hydrochloride thì cần dùng tối thiểu bao nhiêu tấn ritalinic acid hydrochloride? (làm tròn kết quả đến hàng phần trăm).","contentHtml":"<p>Thuốc Ritalin là chất kích thích hệ thần kinh trung ương được sử dụng phổ biến nhất trong điều trị rối loạn tăng động, giảm chú ý và chứng ngủ rũ. Mỗi viên thuốc ritalin chứa 10 mg methylphenidate hydrochloride được điều chế theo sơ đồ hình dưới:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 77\" data-zoom=\"77:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRj4vAABXRUJQVlA4IDIvAABQuwCdASrtAtkAPj0ejESiIaESeQ1QIAPEtLd5T4703J4LP2YzKqvgH9H/sP5MeZf9B/rv45/2T0t/Dvln69/dP2F/tP7afVV90fz3hx87/gf9l6E/xf7E/Z/7R+2/9o/cr48/3Hg/8Pf7P80v8N8gv4h/If6z/aP2Z/sf7mfU79b2TOyf6D/feoL6m/Of8//av8v/yf9j+8XtHfsPol9g/+V7gP8r/qv+q/w374/6DnPvXP977gf89/vf/e/zX5jfR5/O/9//P/6391Pdt+X/53/o/5f8svsJ/mH9j/3f+F/0H/s/yX////5JCHbo+lqdhWDZg1rbWV5ExMlm2ovYbZCM8y+szuA0hKB36I8O3SEDTDv8QJwyncQptGNklK1GBvEc7vZfzc2jzangnJlYWWc6CFKG37A0hKB3V+pOsoM6D4GiZnyyQKfLWYDmVtZad8jlA79EeHbpCBrnNvNrZh3sziTFIwjQ8JVWCWsz1cK3dCI11yYbVeGKdpCUDv0GSlMnOQdW0ljRCBrnNvObec285tcn7XP0R4dukIGuEpt2BpCUDv0R4dukIGucyo+aB36I8Opm7eUTSWIL0vUd/HvZhfqP+8I2UvRV3E/XYS+33Q109QTbGa3ztISgd+iLr+/y6KW4HFraspiladhjCIS2+CYqxpHIfyGy36f/ey2ToP4PRAUPVlMf2ga+yZt3/4hxcsn2bYhbpDK4LnFZi89+FUDlLfC11h+momaLXrUoRM6X/OHi/c0QelFUug1xIYniXl7PnO5B/plAFuKT6Vqjo9780soZC7Rp+N1XPedjx23NWRTOGnbzLWs1IcO/4Q64up1Jwqm5ZCazifxLn07OzTaakZReDCmJltHPj8fPNi+q7j+IU3eZkFlCYMPcBTI/0LDGMNlgRPeoe3gIBe114nGjbzjU5rKyE1djO0gboFsRsaPBuyDI52dJkDuaSlub4YrecLDXuXVpD8YvZ3bW/HshzB19yQSZR4l0zKX2Q275mm4GBATbUZqugHhf
