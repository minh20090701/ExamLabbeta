n trăm).","contentHtml":"<p>Một loại mỡ động vật có chứa 30% tristearin, 40% tripalmitin và 30% triolein (về khối lượng). Xà phòng hoá 1 tấn mỡ trên bằng dung dịch NaOH với hiệu suất 80%. Lượng muối thu được dùng để sản xuất xà phòng. Biết loại xà phòng này có 72% khối lượng là muối của acid béo. Khối lượng xà phòng thu được là bao nhiêu tấn? (Làm tròn kết quả đến hàng phần trăm).</p>","answer":"1,15","aliases":[],"explanation":"Tính theo 1t nguyên liệu: tristearin 0,3t, tripalmitin 0,4t, triolein 0,3t. Muối sodium lý thuyết =0,3×918/890+0,4×834/806+0,3×912/884≈1,033t. Hiệu suất 80%: muối≈0,826t; xà phòng 72% muối nên m≈0,826/0,72≈1,15t."},{"id":"q079","type":"short","text":"Alcohol X (Mx = 76) tác dụng với carboxylic acid Y thu được hợp chất Z mạch hở (X và Y đều chỉ có một loại nhóm chức). Phân tích Z thu được kết quả %C = 48,84%; %H = 4,65% và %O = 46,51%. Mặt khác, 17,2 gam Z lại phản ứng vừa đủ với 8 gam NaOH trong dung dịch. Biết Z có công thức phân tử trùng với công thức đơn giản nhất. Tổng số CTCT của X, Y, Z thỏa mãn là bao nhiêu?","contentHtml":"<p>Alcohol X (M<sub>x</sub> = 76) tác dụng với carboxylic acid Y thu được hợp chất Z mạch hở (X và Y đều chỉ có một loại nhóm chức). Phân tích Z thu được kết quả %C = 48,84%; %H = 4,65% và %O = 46,51%. Mặt khác, 17,2 gam Z lại phản ứng vừa đủ với 8 gam NaOH trong dung dịch. Biết Z có công thức phân tử trùng với công thức đơn giản nhất. Tổng số CTCT của X, Y, Z thỏa mãn là bao nhiêu?</p>","answer":"6","aliases":[],"explanation":"Từ %C, %H, %O và M(Z)=172 (vì 17,2g Z cần 0,2mol NaOH, mỗi mol Z phản ứng 2mol), suy ra Z=C₇H₈O₅. Alcohol X (M76) là propanediol (2 đồng phân cấu tạo); acid Y là HOOC–C≡C–COOH (1 cấu tạo). Monoester tạo từ Y với hai vị trí –OH không tương đương của propane-1,2-diol cho 2 Z; propane-1,3-diol cho 1 Z. Tổng CTCT X+Y+Z=2+1+3=6."},{"id":"q080","type":"short","text":"Thuỷ phân hoàn toàn 26,1 gam chất béo E (gồm các triglyceride) trong dung dịch NaOH, thu được glycerol và hỗn hợp Y chứa các muối stearate, oleate và palmitate của sodium với tỉ lệ mol tương ứng là 5 : 2 : 2. Tính chỉ số iodine của chất béo E, biết rằng chỉ số iodine là số gam I2 cần để cộng vào các liên kết bội ở gốc hydrocarbon trong 100 gam chất béo (làm tròn đến hàng chục).","contentHtml":"<p>Thuỷ phân hoàn toàn 26,1 gam chất béo E (gồm các triglyceride) trong dung dịch NaOH, thu được glycerol và hỗn hợp Y chứa các muối stearate, oleate và palmitate của sodium với tỉ lệ mol tương ứng là 5 : 2 : 2. Tính chỉ số iodine của chất béo E, biết rằng chỉ số iodine là số gam I<sub>2</sub> cần để cộng vào các liên kết bội ở gốc hydrocarbon trong 100 gam chất béo (làm tròn đến hàng chục).</p>","answer":"19,5","aliases":[],"explanation":"Gọi các muối stearate:oleate:palmitate là 5:2:2. M trung bình muối=(5×306+2×304+2×278)/9=299,33. M trung bình triglyceride=3×299,33+92−3×40=870; n(E)=26,1/870=0,03mol. Một triglyceride trung bình chứa 3×2/9=2/3 liên kết C=C ⇒ n(I₂)=0,03×2/3=0,02mol. Chỉ số iodine=0,02×254/26,1×100≈19,5."},{"id":"q081","type":"short","text":"Tiến hành các thí nghiệm theo các bước sau: Bước 1: Cho vào hai ống nghiệm mỗi ống 2mL ethyl acetate Bước 2: Thêm 2 mL dung dịch H2SO4 20% vào ống thứ nhất; 4 mL dung dịch NaOH 30% vào ống thứ hai Bước 3: Lắc đều cả hai ống nghiệm, lắp ống sinh hàn, đun sôi nhẹ trong khoảng 5 phút, để nguội Cho các phát biểu sau: (1) Sau bước 2, chất lỏng trong cả hai ống nghiệm đều chuyển sang màu vàng. (2) Sau bước 2, ống nghiệm thứ hai xuất hiện kết tủa trắng chính là xà phòng. (3) Sau bước 3, ở hai ống nghiệm đều thu được sản phẩm giống nhau. (4) Sau bước 3, trong ống nghiệm thứ nhất vẫn còn ethyl acetate. (5) Ở bước 3, có thể thay việc đun sôi nhẹ bằng đun cách thủy (ngâm trong nước nóng). (6) Ống sinh hàn có tác dụng hút nước giúp cho phản ứng xảy ra theo chiều thuận. Có bao nhiêu phát biểu đúng?","contentHtml":"<p>Tiến hành các thí nghiệm theo các bước sau:</p><p>Bước 1: Cho vào hai ống nghiệm mỗi ống 2mL ethyl acetate</p><p>Bước 2: Thêm 2 mL dung dịch H<sub>2</sub>SO<sub>4</sub> 20% vào ống thứ nhất; 4 mL dung dịch NaOH 30% vào ống thứ hai</p><p>Bước 3: Lắc đều cả hai ống nghiệm, lắp ống sinh hàn, đun sôi nhẹ trong khoảng 5 phút, để nguội</p><p>Cho các phát biểu sau:</p><p class=\"qbullet\">(1) Sau bước 2, chất lỏng trong cả hai ống nghiệm đều chuyển sang màu vàng.</p><p class=\"qbullet\">(2) Sau bước 2, ống nghiệm thứ hai xuất hiện kết tủa trắng chính là xà phòng.</p><p class=\"qbullet\">(3) Sau bước 3, ở hai ống nghiệm đều thu được sản phẩm giống nhau.</p><p class=\"qbullet\">(4) Sau bước 3, trong ống nghiệm thứ nhất vẫn còn ethyl acetate.</p><p class=\"qbullet\">(5) Ở bước 3, có thể thay việc đun sôi nhẹ bằng đun cách thủy (ngâm trong nước nóng).</p><p class=\"qbullet\">(6) Ống sinh hàn có tác dụng hút nước giúp cho phản ứng xảy ra theo chiều thuận.</p><p>Có bao nhiêu phát biểu đúng?</p>","answer":"2","aliases":[],"explanation":"(1),(2) sai: các chất lỏng không chuyển vàng/không xuất hiện xà phòng ngay sau khi thêm hóa chất. (3) sai vì thủy phân trong acid cho acid carboxylic, trong kiềm cho muối; (4) đúng do phản ứng trong acid thuận nghịch, còn ester; (5) đúng vì có thể đun cách thủy; (6) sai vì ống sinh hàn ngưng tụ hơi, không hút nước. Có 2 phát biểu đúng."},{"id":"q082","type":"short","text":"Chất béo là nguồn cung cấp năng lượng đáng kể cho cơ thể người. Trung bình 1 gam chất béo cung cấp 38 kJ và năng lượng từ chất béo đóng góp 20% tổng năng lượng cần thiết trong ngày. Một ngày, một học sinh trung học phổ thông cần năng lượng 9120 kJ thì cần ăn bao nhiêu gam chất béo cho phù hợp?","contentHtml":"<p>Chất béo là nguồn cung cấp năng lượng đáng kể cho cơ thể người. Trung bình 1 gam chất béo cung cấp 38 kJ và năng lượng từ chất béo đóng góp 20% tổng năng lượng cần thiết trong ngày. Một ngày, một học sinh trung học phổ thông cần năng lượng 9120 kJ thì cần ăn bao nhiêu gam chất béo cho phù hợp?</p>","answer":"48","aliases":["48"],"explanation":"Theo đề, năng lượng từ chất béo chiếm 20% × 9120 = 1824 kJ. Với 38 kJ cho 1 g chất béo, khối lượng tính được bằng 1824/38 = 48 g."},{"id":"q083","type":"short","text":"Thuốc Paracetamol là một loại thuốc được sử dụng rất nhiều trong y học. Thuốc có tác dụng giảm đau, hạ sốt, tuy nhiên ít có tác dụng kháng viêm. Thuốc Paracetamol được tổng hợp từ p- nitrophenol theo sơ đồ sau: Để sản xuất 30,2 triệu viên thuốc Paracetamol cần dùng bao nhiêu tấn p-nitrophenol? Biết rằng mỗi viên thuốc chứa 500 mg Paracetamol và hiệu suất của mỗi giai đoạn phản ứng là 80 %. Làm tròn kết quả đến phần chục.","contentHtml":"<p>Thuốc Paracetamol là một loại thuốc được sử dụng rất nhiều trong y học. Thuốc có tác dụng giảm đau, hạ sốt, tuy nhiên ít có tác dụng kháng viêm. Thuốc Paracetamol được tổng hợp từ p- nitrophenol theo sơ đồ sau:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 83\" data-zoom=\"83:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRk4zAABXRUJQVlA4IEIzAACQ2ACdASqgAhEBPj0ejUSiIaGRyOUMIAPEtLdwt1dOJNznh+Qf378YvPX8Z+e/s397/X/+6/tj7OPk+7D/0v5ge5X8f+0/2T+6ftd/cv3S+fv9//e/I/5Zf2f9y/JH5Bfxn+P/1z+x/s1/ev3Z+vKILp3/0vUI9ZfpP+l/wP7of4z9yfbu/1fUb7Qf7T3Af5f/Uv8p/ev3v/xHQE+Xfsh8An86/v//d/yPum/2//l/zf+1/a33wfn/+V/7H+V/e7/U/YZ/MP6z/sP8R/mP/b/kv///8xya3GnDw2U3wURqU60IqOD2fT2ChcfONe81Hyg5cKG1xgk9goXaf6BAekBQbw/9CMTJk4/VQ/4xfQnmvsWyBlnChdp7LC9DjqQFT4zP06XLIxeeok7pAborvYJPYKF2n9Xi4ri4BNy1HOfVs7N9NhLPWlp9iGtu37tvpsvCNjHpxkcyoHBOx/k5G0oUlya/AlRedKeuDwsi1FaLeXs8/gTbPk6F2lwkfZQvQii4f2ukbYaA1TOmd7mwLPt2PXChtcYJONlPlaBTKVz/C+SX5duINBwPP1QPgFHL3nxlK85HMv6A8rpj/wyEypyMw514nYsZxzMrlycV7BJ7BQq8DlwobXGCT2CAMWZi6dgL/ESKEJvLvDZXDTgr66Uva5r64UNqo+f/ZnGJBI68221XGAtR4kmArZO6oPXYZITOKf9c32/iVvN3v/FwAf+IS1yyWAMM0dlzx8Tt8LnsESKwyLSl4gwu/9sRj8SgolNkTdqVLfRFi7/zlxG2n26Vz7mBhjszNQ1Wn/SfZBSuWSMlGyzt5cFJOIRn7Ux0YMmN93BfJUbqNzNr3YfAJ9hFr/yDhhHgzE6MlMySq+c9ge0QLsZO1WY5/Ey9UX5enwTk8UJ49+1wVL3qKQt/CZDUMukZfeUGYtZQMndSmixQzipl1Z0gbw1RsZw0MVxAD5XE3F+mNdDIGIxw6CWarlR37RV3F7y0z5ax/XGx4b2aTVbpic0QrBurG5pVEP77B/3FpUX1cAWyo ép tính cuối cùng, kết quả làm tròn đến hàng phần mười).</p>","answer":"1,2","aliases":[],"explanation":"Eugenol có một vòng benzene (3 liên kết π C=C) và một nối đôi ở mạch nhánh (1), nên hydrogen hóa hoàn toàn thành cyclohexanol dẫn xuất cần 4mol H₂/mol. 0,3mol eugenol dùng 0,3×4=1,2mol H₂."},{"id":"q086","type":"short","text":"Isopropyl myristate là một ester thường được sử dụng trong kem dưỡng da, dầu tẩy trang và sản phẩm chăm sóc tóc như một chất làm mềm, chất kết dính và chất tăng hương thơm vì khả năng thẩm thấu tốt mà không gây nhờn rít. Ester này được tạo ra từ phản ứng giữa acid béo bão hòa myristic và isopropyl alcohol. Công thức khung phân tử của isopropyl myristate như sau: Một lọ kem dưỡng da có thể tích thực là 100 mL cho biết thành phần có chứa 3% isopropyl myristate theo khối lượng. Giả sử khối lượng riêng của kem dưỡng da đã cho là 0,85 g/mL. Lượng ester cần dùng để sản xuất 500 lọ kem trên là bao nhiêu kg? (kết quả làm tròn đến giá trị hàng chục).","contentHtml":"<p>Isopropyl myristate là một ester thường được sử dụng trong kem dưỡng da, dầu tẩy trang và sản phẩm chăm sóc tóc như một chất làm mềm, chất kết dính và chất tăng hương thơm vì khả năng thẩm thấu tốt mà không gây nhờn rít. Ester này được tạo ra từ phản ứng giữa acid béo bão hòa myristic và isopropyl alcohol. Công thức khung phân tử của isopropyl myristate như sau:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 86\" data-zoom=\"86:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRqwNAABXRUJQVlA4IKANAABQTACdASoFA3sAPj0ejkSiIaGS6txkIAPEtLdwukcADOzru/Un+y9qn91/rf61eg/4d8y/XP6Z+znrBZR+s3Ug+L/bD8P9uftB3r/i/6v6Av4l/Jv6v+RX9S9yt7Rx2oB/H/7N/v/7zyUeIBwJlAbyR/7zyi/mH+r9hD+Vf3j/gf3f8jhkt3yayyqr++3fJrLKqv77d8moz4WrSlNodAMVbHoCFISWhUwzWVIPJaFTDNZUg8loVMM1lJbiMkIECoa5zyhhwC96EdQgUYqQeS0KmGaypB5LQqYZrKkHktCgNGUqSPS+1oDAvbrLfWWVVf3275NZZVV/fbvk1llVX980mB01MihmsemB6r/zCdp0DfNN+zfw5m53RIGQ85y9nrx7eUp62VEUJHIs+5fo2WhoX9sTfGutfRJm QsvDQ8HTcPnAQ/Z0ABr5TMkSEb/x2TF95JYEvofQxa99iYCH1xJbcFuye+t82UhAWxUDszY4pV/ZKx/Qo2FNf5KKw6/VkrW9KVr7O7OtY4/93gVX5+mSkJWsOmYmaHS7n8xbLpiDKkUO0y6VdC12K6AAZFzMxMPL1Zv7vR+K/BNY+4YRnIzgqYuZ46qANFXGOUmXs/zqQCX6U+jKZG5u/10LE0T+1Zsy5IREUAAAAA==\"/></figure><p> Một lọ kem dưỡng da có thể tích thực là 100 mL cho biết thành phần có chứa 3% isopropyl myristate theo khối lượng. Giả sử khối lượng riêng của kem dưỡng da đã cho là 0,85 g/mL. Lượng ester cần dùng để sản xuất 500 lọ kem trên là bao nhiêu kg? (kết quả làm tròn đến giá trị hàng chục).</p>","answer":"1,3","aliases":[],"explanation":"Khối lượng một lọ kem =100mL×0,85g/mL=85g. Ester chiếm 3% nên mỗi lọ chứa 2,55g. 500 lọ dùng 500×2,55=1275g=1,275kg ≈1,3kg."},{"id":"q087","type":"short","text":"Formic acid là một chất lỏng, mùi xốc mạnh và gây bỏng ra, acid này được chưng cất lần đầu từ loài kiến lửa có tên là Formicarufa. Kiến khi cắn sẽ “tiêm” dung dịch chứa 50% thể tích formic acid vào da. Trung bình mỗi lần cắn, kiến có thể “tiêm” khoảng 6,0.10-3 cm³ dung dịch formic acid. Để làm giảm lượng formic acid trong vết cắn, bác sĩ thường dùng thuốc có chứa thành phần là sodium hydrogencarbonate (NaHCO3). Tính khối lượng sodium hydrogencarbonate (mg) cần dùng để trung hòa hoàn toàn lượng formic acid từ vết kiến cắn (biết khối lượng riêng của formic acid là 1,22 g/cm³). (Kết quả làm tròn đến hàng phần mười).","contentHtml":"<p>Formic acid là một chất lỏng, mùi xốc mạnh và gây bỏng ra, acid này được chưng cất lần đầu từ loài kiến lửa có tên là Formicarufa. Kiến khi cắn sẽ “tiêm” dung dịch chứa 50% thể tích formic acid vào da. Trung bình mỗi lần cắn, kiến có thể “tiêm” khoảng 6,0.10-3 cm³ dung dịch formic acid. Để làm giảm lượng formic acid trong vết cắn, bác sĩ thường dùng thuốc có chứa thành phần là sodium hydrogencarbonate (NaHCO<sub>3</sub>). Tính khối lượng sodium hydrogencarbonate (mg) cần dùng để trung hòa hoàn toàn lượng formic acid từ vết kiến cắn (biết khối lượng riêng của formic acid là 1,22 g/cm³). (Kết quả làm tròn đến hàng phần mười).</p>","answer":"6,7","aliases":[],"explanation":"Thể tích formic acid trong dung dịch =6,0×10⁻³×50%=3,0×10⁻³cm³. m(HCOOH)=3,0×10⁻³×1,22=0,00366g; n=0,00366/46mol. Trung hòa tỉ lệ 1:1 với NaHCO₃ (M84): m=0,00366×84/46=0,00668g≈6,7mg."},{"id":"q088","type":"short","text":"Phân tích nguyên tố hợp chất hữu cơ mạch hở E cho kết quả phần trăm khối lượng carbon, hidrogen, oxygen lần lượt là 40,68%; 5,08%; 54,24%. Phương pháp phân tích phổ khối lượng (phổ MS) cho biết E có phân tử khối bằng 118. Từ E thực hiện sơ đồ các phản ứng sau theo đúng tỉ lệ mol: (1) E + 2NaOH → X + Y + Z (2) X + HCl → F + NaCl (3) Y + HCl → T + NaCl Biết: Z là ancol đơn chức; F và T là các hợp chất hữu cơ; MF < MT. Trong các phát biểu sau : (1) Trong Y, số nguyên tử hydrogen bằng số nguyên tử oxygen. (2) Chất F không có khả năng tham gia phản ứng tráng bạc. (3) Nhiệt độ sôi của Z thấp hơn nhiệt độ sôi của ethanol. (4) Chất T thuộc loại hợp chất hữu cơ đa chức Có bao nhiêu phát biểu đúng?","contentHtml":"<p>Phân tích nguyên tố hợp chất hữu cơ mạch hở E cho kết quả phần trăm khối lượng carbon, hidrogen, oxygen lần lượt là 40,68%; 5,08%; 54,24%. Phương pháp phân tích phổ khối lượng (phổ MS) cho biết E có phân tử khối bằng 118. Từ E thực hiện sơ đồ các phản ứng sau theo đúng tỉ lệ mol:</p><p class=\"qbullet\">(1) E + 2NaOH → X + Y + Z</p><p class=\"qbullet\">(2) X + HCl → F + NaCl</p><p class=\"qbullet\">(3) Y + HCl → T + NaCl</p><p>Biết: Z là ancol đơn chức; F và T là các hợp chất hữu cơ; MF &lt; MT. Trong các phát biểu sau :</p><p class=\"qbullet\">(1) Trong Y, số nguyên tử hydrogen bằng số nguyên tử oxygen.</p><p class=\"qbullet\">(2) Chất F không có khả năng tham gia phản ứng tráng bạc.</p><p class=\"qbullet\">(3) Nhiệt độ sôi của Z thấp hơn nhiệt độ sôi của ethanol.</p><p class=\"qbullet\">(4) Chất T thuộc loại hợp chất hữu cơ đa chức</p><p>Có bao nhiêu phát biểu đúng?</p>","answer":"2","aliases":[],"explanation":"Từ % nguyên tố và M118 suy ra E=C₄H₆O₄. Sơ đồ phù hợp ester kép HCOOCH₂COOCH₃, tạo HCOONa (X), HOCH₂COONa (Y) và methanol (Z). (1) đúng: Y có H=O=3; (2) sai: F=HCOOH có tráng bạc; (3) đúng: methanol sôi thấp hơn ethanol; (4) sai: T=HOCH₂COOH là tạp chức, không phải đa chức cùng loại. Có 2 ý đúng."},{"id":"q089","type":"short","text":"Chỉ số acid của chất béo là số miligam KOH dùng để trung hoà acid béo tự do có trong 1 gam chất béo. Để tác dụng hết với 120 gam chất béo có chỉ số acid bằng 7 phải dùng 15,36 gam NaOH, thu được m gam muối. Giá trị của m bằng bao nhiêu? (lấy số nguyên gần nhất).","contentHtml":"<p>Chỉ số acid của chất béo là số miligam KOH dùng để trung hoà acid béo tự do có trong 1 gam chất béo. Để tác dụng hết với 120 gam chất béo có chỉ số acid bằng 7 phải dùng 15,36 gam NaOH, thu được m gam muối. Giá trị của m bằng bao nhiêu? (lấy số nguyên gần nhất).</p>","answer":"124","aliases":[],"explanation":"Axit béo tự do cần m(KOH)=120×7mg=0,84g ⇒ n(acid)=0,84/56=0,015mol. n(NaOH tổng)=15,36/40=0,384mol; triglyceride dùng 0,384−0,015=0,369mol ⇒ n(glycerol)=0,123mol, m=11,316g. Trung hòa acid tạo 0,015×18=0,27g nước. m(muối)=120+15,36−11,316−0,27=123,774g≈124g."},{"id":"q090","type":"short","text":"Hợp chất hữu cơ E mạch hở có công thức phân tử C5H10O4. Cho phương trình phản ứng (đã cân bằng phương trình) chuyển hóa E như sau: E + NaOH (t°) → A1 + A2 A1 + HCl → A3 + NaCl A2 + 3A3 (t°, xt) ⇋ A4 + 3H2O Dung dịch mỗi chất tan E, A2 và A3 đều có khả năng hòa tan Cu(OH)2. Hợp chất A4 có công thức phân tử C9H14O6. Cho các nhận xét sau đây: (1) Phân tử E có chứa hai nhóm methyl (CH3-). (2) Tại điều kiện thường (25°C, 1 bar), hợp chất A1 ở trạng thái rắn. (3) Phân tử khối của A2 là 92. (4) A3 có tham gia phản ứng iodoform (với dung dịch I2/NaOH) cho kết tủa vàng. (5) A4 là hợp chất đa chức. Có những nhận xét nào đúng? (Các nhận xét đúng phải xếp theo thứ tự từ nhỏ đến lớn, viết liền. Ví dụ: 1234; 145;…).","contentHtml":"<p>Hợp chất hữu cơ E mạch hở có công thức phân tử C<sub>5</sub>H<sub>10</sub>O<sub>4</sub>. Cho phương trình phản ứng (đã cân bằng phương trình) chuyển hóa E như sau:</p><p>E + NaOH (t°) → A<sub>1</sub> + A<sub>2</sub></p><p>A<sub>1</sub> + HCl → A<sub>3</sub> + NaCl</p><p>A<sub>2</sub> + 3A<sub>3</sub> (t°, xt) ⇋ A<sub>4</sub> + 3H<sub>2</sub>O</p><p>Dung dịch mỗi chất tan E, A<sub>2</sub> và A<sub>3</sub> đều có khả năng hòa tan Cu(OH)<sub>2</sub>. Hợp chất A<sub>4</sub> có công thức phân tử C<sub>9</sub>H<sub>14</sub>O<sub>6</sub>. Cho các nhận xét sau đây:</p><p class=\"qbullet\">(1) Phân tử E có chứa hai nhóm methyl (CH<sub>3</sub>-).</p><p class=\"qbullet\">(2) Tại điều kiện thường (25°C, 1 bar), hợp chất A<sub>1</sub> ở trạng thái rắn.</p><p class=\"qbullet\">(3) Phân tử khối của A<sub>2</sub> là 92.</p><p class=\"qbullet\">(4) A<sub>3</sub> có tham gia phản ứng iodoform (với dung dịch I<sub>2</sub>/NaOH) cho kết tủa vàng.</p><p class=\"qbullet\">(5) A<sub>4</sub> là hợp chất đa chức.</p><p>Có những nhận xét nào đúng? (Các nhận xét đúng phải xếp theo thứ tự từ nhỏ đến lớn, viết liền. Ví dụ: 1234; 145;…).</p>","answer":"235","aliases":[],"explanation":"A₂ là glycerol (M92), A₃ là acetic acid, A₁ là sodium acetate, A₄ là triacetin. (1) sai: glycerol monoacetate E chỉ có một nhóm methyl của acetate; (2) đúng vì sodium acetate là chất rắn ở 25°C; (3) đúng, glycerol M92; (4) sai vì acetic acid không tham gia iodoform; (5) đúng vì triacetin có ba nhóm ester. Ghép các số 2,3,5 thành 235."},{"id":"q091","type":"short","text":"Paracetamol còn được gọi là acetaminophen, là một loại thuốc có tác dụng hạ sốt và giảm đau. Paracetamol (C8H9NO2) có thể tổng hợp trực tiếp từ 4-aminophenol (C6H7NO) và acetic anhydride (C4H6O3) theo phương trình như sau: Để sản xuất 10000 hộp paracetamol (quy cách 10 vỉ x 10 viên mỗi hộp, mỗi viên hàm lượng 500mg) với hiệu suất cả quá trình đạt 70% cần sử dụng m tấn 4-aminophenol (độ tinh khiết 98%). Giá trị của m là bao nhiêu? (kết quả làm tròn đến hàng phần trăm).","contentHtml":"<p>Paracetamol còn được gọi là acetaminophen, là một loại thuốc có tác dụng hạ sốt và giảm đau. Paracetamol (C<sub>8</sub>H<sub>9</sub>NO<sub>2</sub>) có thể tổng hợp trực tiếp từ 4-aminophenol (C<sub>6</sub>H<sub>7</sub>NO) và acetic anhydride (C<sub>4</sub>H<sub>6</sub>O<sub>3</sub>) theo phương trình như sau:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 91\" data-zoom=\"91:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRqYZAABXRUJQVlA4IJoZAACwhwCdASpEA94APj0ejUUiIaERKZS8IAPEtLdwueqdMbhaTyV/ae1H+qfi/+8/rT+HfJv1P+yfsF/cv/f7vn974rfNP5j/S+hn8V+wH23+0ftT/fP3S+Kf9n4g/En+69QX8Z/kf9n/sP7Df2/9tvWZ7gfW/9l6AvrX9E/1P97/Kf0TP6X0T+wnsA/zD+4f7njkqAn9L/y3qh/1H/o+9H3qfl/+h/8v+q+BL+V/2v/d/4f/Mf+//FCd6djLYuJy6q2BJeNK5MaVyY0rkxo/OpnrkZU6svnZEvMQcE08CgKF8tHMbEucb0FPrY666NePM+DJbquE7RsBmwgkJGVPBnATlVNLoV148z4Ml40rkxpXI6jHTh7ZE0o4zl8nXHnAaQanxCwEYw4Z5xaqvdYMbaaf2h5sRnpRFhIORsJH9jy9KGqDSuTGlcmNKq99HJeTqQ6Td0EF4110a8eZ8GS8aVwV9uwyiy1fECuL6pfHBSl5v1AmCilKOwQz4Ml4KNN6eimlfyZysHRrxchcfCaNWrNS6U+C2ZTuelujXj03jdk8aVyY0qkO6sN3eW3YhKGBWxJgkEQ//lW8aD+kDdOsbevNkp2alhJeDHy2F2YktsLg2GghLJBrWzQMpY8aBrro148BioMTxdrnOKspKRPTT43fWCS8aVUYGtS0m+VCSlPtCzpw7/00TucTxqMuUOWm25aB5qVUYzTGlcj0lKTiPn61HFV2zBgAdYSXjR2iCiiqIW48bK6ShMA22RcCLFbo92YKtLdGuyN8NS/k2jYvz8fPCZotTtir0NIHNOzDs0e3i1PZEr8rkxpAzzemOEtkM/MT3MXPrhnokuCdH5rrbL/X1Jz49goCW6AB+Ph87PDUwJn1FxK+/sxS7nSOGuAsvMabIvCE/yzVzcdcVzaS4W0JCF8ZjzrkzFtr2RQTshGiV5MBybiVKd046rWgLmFXdfsnIZ+K1YaY5mvOaC59T32EJW5lsfZv8L4k53YlQ4ND+2AWGHzQ4ceaeSZuqf4+Hk37pbfpInemDNU/VO757r2f1FUAec7+z/IqN5jaHGDyGQYu3lKjEKjULw8zj5B0f2FWZPzuN+U8TgouXAe40ioTVc0bY1DvxYVpXJjR66KlnY0+EBMO9naW7dOCtzb9dWiUMTfWOrl4oIJT7EAZNQdGuum7ui/SWK8RyFIWVbD9vvAlAsa66NhZl7PXMM+DJeNK5H0W2njkyxeM/Fg+51RQnx2zvNUFzyY0r7X8rkxjhdau4OjXjzPgyXjSuTGlcmNHmbz0kY8z4Ml40rkxjy2RUDxpXJjSuTGlcmNK5MaVyYNR2m4vGlcmNK5MaVSHkbmp7V8ASz1oPyK4psGqWEl40rkxpXJjSuTGlUb11r3ic0pZiWUgW3+L/2lhJeNK5MZA0EfIHwatqwZLxpXJjSuTGlcmNK5INjiBFnFJbjdRjSuTGlcAAAD+/8KcSFpaA2Ir1Novf7x3nLWP/bhnxvfzdmoOeooyjjPWb0EtJOIkZNKVjn9wBbw3aYeO8CNYGui/IN0v  phòng. Biết rằng mỗi bánh xà phòng nặng 100 gam trong đó muối của acid béo chiếm 72% về khối lượng. Giá trị của k bằng bao nhiêu (làm tròn kết quả đến số nguyên)?","contentHtml":"<p>Xà phòng hóa hoàn toàn 132,9 kg chất béo bằng dung dịch NaOH vừa đủ, thu được 13,8 kg glycerol và muối dùng để làm xà phòng. Toàn bộ lượng muối thu được ở trên được trộn với phụ gia và đóng thành k bánh xà phòng. Biết rằng mỗi bánh xà phòng nặng 100 gam trong đó muối của acid béo chiếm 72% về khối lượng. Giá trị của k bằng bao nhiêu (làm tròn kết quả đến số nguyên)?</p>","answer":"1904","aliases":["1904","1904,17"],"explanation":"Từ 13,8 kg glycerol: n = 13,8/92 = 0,15 kmol nên NaOH phản ứng = 3×0,15 = 0,45 kmol, m = 18 kg. Bảo toàn khối lượng: m(muối)=132,9+18−13,8=137,1 kg. Mỗi bánh có 100×72%=72 g muối; số bánh = 137100/72 ≈ 1904 bánh."},{"id":"q093","type":"short","text":"Hợp chất hữu cơ X mạch hở, không nhánh (chứa C, H, O) được sử dụng rộng rãi trong chăn nuôi gia súc, gia cầm và là một phụ gia mới trong thức ăn thủy sản. Kết quả phân tích thành phần nguyên tố chất X thu được %C = 54,55%; %H = 9,09%; còn lại là oxygen. Phân tích phổ khối lượng (MS) chất X, xác định được peak ion phân tử có giá trị m/z = 88. Phân tích phổ hồng ngoại (IR) chất X thu được tín hiệu như hình bên dưới. Hợp chất Y mạch hở, là đồng phân khác chức của X, Y tác dụng được với dung dịch NaOH. Cho 4,4 mL Y (khối lượng riêng 0,9 g/mL) tác dụng hoàn toàn với 100 mL dung dịch NaOH 1M, cô cạn dung dịch sau phản ứng thu được chất hữu cơ Z và 5,89 gam chất rắn khan. Cho X tác dụng với Z (H2SO4 đặc, t0) thu được hợp chất T có mùi thơm. Khối lượng phân tử của T là bao nhiêu amu? Phổ hồng ngoại (IR) chất X và bảng số sóng hấp thụ đặc trưng trên phổ hồng ngoại (IR) của một số nhóm chức: Liên Số sóng Loại hợp chất kết (cm-1) 3500 - Alcohol O-H 3200 1740 - C=O 1685 Aldehyde 2830 - C-H 2695 1760 - C=O 1690 Carboxylic acid 3300 - O-H 2500 1750 - C=O 1715 Ester 1300 - C-O 1000 1715 - Ketone C=O 1666","contentHtml":"<p>Hợp chất hữu cơ X mạch hở, không nhánh (chứa C, H, O) được sử dụng rộng rãi trong chăn nuôi gia súc, gia cầm và là một phụ gia mới trong thức ăn thủy sản. Kết quả phân tích thành phần nguyên tố chất X thu được %C = 54,55%; %H = 9,09%; còn lại là oxygen. Phân tích phổ khối lượng (MS) chất X, xác định được peak ion phân tử có giá trị m/z = 88. Phân tích phổ hồng ngoại (IR) chất X thu được tín hiệu như hình bên dưới.</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 93\" data-zoom=\"93:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRuBBAABXRUJQVlA4INRBAACQJAGdASqXAtMBPj0ejESiIaESqY0EIAPEsrd7Pb+k77rIBsuy7deXGl+8fyLt6Zr8CfUP7N+8/8494bmXtE9j+QfZD+xn5AdY/k3+V8pXxT8o/xf9f/yn66fUz0P/739tPcC/wv+F/3Pt+/gH6Ae4T/pfsB7AP6X/kP+h/uvcm/vf/N/xH7//Iv9Rf9F/cv8F/+foC/jn9L/3X5//Jj/jvZA/lf+j/8/uE/xr+wf8v8//+T9Tv/A/+f+v/6Xy0/1f/VftL/0fhJ/yn/x/br4AP//6gHVT9cf7x+QfhH/n/8J+3fnX+MfOP5D+2fuX72f0j/df4fxnebfw3+8/1PqV/IPtt+e/uf+R/4H9++bn81/sPy98+/2v+J/6/qEe3P85+X39u+pZ777JoC+pH+Z/x37rf5n21vj/+p6E/k/9t/8H+Q/Jj7Af4p/NP9R/cfyi+Mf+l5N30b/pftr8Av85/v3/l/3f5jfTR/Z/+T/Q/5/9t/hR+jf57/uf4n4F/51/X/9x/ivyX5JL9kSE0F+kazTKy+1j6X2rokMTwZCidD0IzqYJ4MhROh6EZ1ME8GQonQ9CM6mCeChUBkGdhUGALZL/iQN1tJ+BEyN0GJHwIiZjX7P/8gWbA4+NpEiDU91+L0qlToebb9ynoRmvx40VJ+QEB1IGmAuyE0EeXUZ3v0bhP+QLNgcew8SvYTlYaeS7nZ5hjouqC4AgDPltq8ZgttAzqSaMrxYltwWTHCNcWGNYJRki2sycCWmv3EZyIq4k2HwFeeYb6YDr34gvYLl8KAZ8RvtmbdG10YUwCjKz0oddMRLRx0sRbXFXG3g2NpMMKuzNpWguo8KT1oCCQMY4/Q+G7sMc++uLEdhRpIUoSukpVwtwAix730AZ1eiQ6K/N6dXbi3Eri2q9gZjzQUUNu+bBFqC/CXeu6Go98CJgOF3pU4oh5yzrEibpSh/MiXzx0tyfIeMH34w0TzrpVmv/lnBIlcsN02mZJcP3KH3mOYFf9TXCGYaiqksblrc1XnHjUPFcuUPBDLhj2Dbs78o8AYrGDzoxcqDfdThaZcF6YIwazkRU6/uP60GubPP5rRrDpfRx6W9us/ePxYkYuEngGxQiElgNvYHj05Sq++SOTLwS/e9xSA+lHsoVmP4l48d8gIGoELrGJT9QGiYAfn66TdJ7julkJTetT3TlONtymBxtNIC4DQh/eNZD0I5y2iktSMrA/0s1G4hs+u4MzEVEYCiWt2lyPS1Pd+DtKFrFZBxdQGs9izDE4E7nrhOsZlM6OwVoCRBrHYNs0FiJwmXe9O3uA8+Iq6yJR/5G12mpYxnkXGRzhq9Xc9i+aSefAMsdUKCFSFkSEhIezWc110PsvLBZOG >3300–2500</td></tr>\n<tr><td>Ester</td><td>C=O</td><td>1750–1715</td></tr>\n<tr><td>Ester</td><td>C–O</td><td>1300–1000</td></tr>\n<tr><td>Ketone</td><td>C=O</td><td>1715–1666</td></tr>\n</tbody>\n</table></div>","answer":"116","aliases":[],"explanation":"Từ %C, %H, %O và M88 suy ra C₄H₈O₂. Phổ IR thể hiện nhóm –COOH; X mạch không nhánh là butanoic acid (C₄H₈O₂). Y là đồng phân ester: m(Y)=4,4×0,9=3,96g ⇒ n(Y)=0,045mol. NaOH dư 0,100−0,045=0,055mol (=2,20g); muối khan=5,89−2,20=3,69g ⇒ M(muối)=82, ứng với CH₃COONa. Do đó Y là ethyl acetate và Z là ethanol (C₂H₅OH). Este hóa X với ethanol: M(T)=88+46−18=116 (ethyl butanoate)."},{"id":"q094","type":"short","text":"Salicin là một thuốc chống viêm được sản xuất từ vỏ cây liễu. Công thức cấu tạo của Salicin cho dưới đây: Về mặt hóa học, salicin có quan hệ gần gũi với aspirin và cũng có tác dụng tương tự trên cơ thể người. Khi dùng, nó được chuyển hóa thành salicylic acid theo phản ứng sau: Cho biết hiệu suất của cả quá trình là 80%. Nếu dùng 143 gam salicin thì sẽ chuyển hóa thành bao nhiêu gam salicylic aicid?","contentHtml":"<p>Salicin là một thuốc chống viêm được sản xuất từ vỏ cây liễu. Công thức cấu tạo của Salicin cho dưới đây:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 94\" data-zoom=\"94:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRrAjAABXRUJQVlA4IKQjAABwvACdASr6AiMBPj0ejUUiIaERSTS0IAPEtLdwue81+KkQLGfZilW77+EudtKJ2A/yfuV+Enqi/Pn+59wT9K/9d/S+u75mP1+/Zv3n/xu94XoAftZ1nnoFeWp+6/wuf2X/T/s77Peqveff7P+PXmV/av7l+SPoD+LfN/2v8lf8Fzfd5HoT/IPtz9+/tv7l/3f3j/43jD+V/s//D/t/sEfkP8h/uX9t/aL85/p1+u74XVfML9bvqn+8/v3jTf3H9k9cPsP/s/uG+wL+f/2v/S8eH6L7Af9K/u3/N/z/5LfSV/U/+f/SelH85/zX/b/y3wF/y7+z/7P/B/5j/5f6L//8tELXBkvODJecGS84Ml5wZLzgyXnBkvODJecGS84Ml5wZLzgyXnBkvODJecGS84Ml5wZLzgyXnBhEfPTEBVvdIYtV48z4Ml5wZLzgyXnBkvODJeSmiqSxetMyetAgdBAoxhv5RfPzyvf7PfF2lhh60u9xAI+/rTrcEtBK8xDN/MqV/D4F+VyL7B7Rnm7nuS1/TjOlainVQneLzdGvHmfA87HXQjdbGcQEo551KZUg0r29r0tR1Da am. Methyl salicylate điều chế theo phản ứng sau:</p><p>HOC<sub>6</sub>H<sub>4</sub>COOH + CH<sub>3</sub>OH (H<sub>2</sub>SO<sub>4</sub> đặc, t°) ⇋ HOC<sub>6</sub>H<sub>4</sub>COOCH<sub>3</sub> + H<sub>2</sub>O</p><p>Để sản xuất một triệu hộp 12 chai dầu trên cần tối thiểu m tấn salicylic acid, với hiệu suất cả quá trình là 80%. Giá trị của m là bao nhiêu? kết quả lấy sau dấu phẩy 01 chữ số thập phân.</p>","answer":"29,4","aliases":[],"explanation":"Một triệu hộp×12 chai/hộp×2,16g methyl salicylate/chai=25,92t sản phẩm. M(methyl salicylate)=152, M(salicylic acid)=138. Hiệu suất 80% ⇒ m(acid)=25,92×138/(152×0,8)≈29,4t."},{"id":"q098","type":"short","text":"DHA là một acid béo omega-3 quan trọng cho phát triển não bộ và chức năng thị giác. Acid béo omega-3 EPA giúp giảm viêm và bảo vệ sức khỏe tim mạch. Công thức của DHA và EPA như hình dưới: Một loại triglyceride (X) phổ biến trong dầu cá mòi, thường được sử dụng để bổ sung DHA và EPA cho cơ thể. Trong cơ thể người, nhờ enzyme lipase, (X) bị thủy phân và giải phóng các acid béo tự do, bao gồm DHA, EPA, và palmitic acid (C15H31COOH). Hãy tính phân tử khối của triglyceride (X).","contentHtml":"<p>DHA là một acid béo omega-3 quan trọng cho phát triển não bộ và chức năng thị giác. Acid béo omega-3 EPA giúp giảm viêm và bảo vệ sức khỏe tim mạch. Công thức của DHA và EPA như hình dưới:</p><figure class=\"figurebox\"><span class=\"figuretag\">HÌNH MINH HỌA / DỮ KIỆN GỐC</span><img alt=\"Hình minh họa câu 98\" data-zoom=\"98:0\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRoITAABXRUJQVlA4IHYTAAAQaQCdASogAuIAPj0ejUSiIaGSObzAIAPEtLdwulCN+c/5B/tXa3/kfxo88fw/5b+6/2T9sf7tyg4kfyL7Yfgv7f+6vsj31/lP8B6BH41/Hv7L/Wf3G/rPEqW1/XH2BfYD6z/xv7x+TfpZf3fpb4gP5ocdPQE/R3qh/2f7X+lT80/1P/u9xL+c/3z/gfckNMAWctoHHzKnbuyxPx2VHJSWJzDVnjsqOSkgkOF+Qlee5iP7PHZUclJYnMNWYN3bOQnAP1p4OShx89xLzR0jeQGZdNtIPeAmrA8c2h5o5CSxOYas7aI6l8O9N/HaOAYIcnD1bHzh50+b/+gCYRxu9lICb5Jx0cyAOO1wSBrTVsdjU0GX6jNCsTMYT24yNiEO//X7PlDzpXP/f+yS/VVlqFCzq/kvKvw7E5hqzx1SaJH/pXLq4Zz 2q+oeP6dUapCuZHnDnbZ3InvR2aIYWRsycoQGIAJL8zcRnP28fo/WPVmbglMr+1IH6Kc4xMn764Yybp4ZMPO/CZ5Zm/vtKLaSA8VJtCmtd6zRlv0n3jgg31wgS3VhJBbEgUSrdJOFch2JhAD8qQvl0CiHw0RvCXyfYfLes9kD1cK0fomRsMjQETc3v31jZPeC41W7YGbEIm5AAAAAAA==\"/></figure><p> Một loại triglyceride (X) phổ biến trong dầu cá mòi, thường được sử dụng để bổ sung DHA và EPA cho cơ thể. Trong cơ thể người, nhờ enzyme lipase, (X) bị thủy phân và giải phóng các acid béo tự do, bao gồm DHA, EPA, và palmitic acid (C<sub>15</sub>H<sub>31</sub>COOH). Hãy tính phân tử khối của triglyceride (X).</p>","answer":"924","aliases":[],"explanation":"Acid DHA có CTPT C₂₂H₃₂O₂, M328; EPA có C₂₀H₃₀O₂, M302; palmitic acid M256. Tạo triglyceride từ glycerol (M92) và ba acid, loại 3H₂O (54): M(X)=328+302+256+92−54=924."},{"id":"q099","type":"short","text":"Một loại chất béo có chứa thành phần như sau: Triglyceride Tristearin Tripalmitin Triolein Tạp chất Thành phần % khối lượng 44,50% 24,18% 26,52% 4,8% (Trong tạp chất không chứa gốc của acid béo) Một nhà mày sản xuất xà phòng bằng cách xà phòng hóa 100 kg chất béo trên bằng dung dịch NaOH với hiệu suất phản ứng của từng chất là 80%. Toàn bộ lượng muối của các acid béo được đem để sản xuất xà phòng (chứa 72% khối lượng là muối của các acid béo). Lượng xà phòng này đem đóng gói thành xà phòng thành phẩm với quy cách đóng gói mỗi bánh xà phòng có khối lượng là 90 gam. Tính số bánh xà phòng mà nhà máy sản xuất được? (kết quả làm tròn số đến phần nguyên).","contentHtml":"<p>Một loại chất béo có chứa thành phần như sau:</p><div class=\"table-scroll\"><table><thead><tr><th>Thành phần</th><th>Tristearin</th><th>Tripalmitin</th><th>Triolein</th><th>Tạp chất</th></tr></thead><tbody><tr><td>% khối lượng</td><td>44,50%</td><td>24,18%</td><td>26,52%</td><td>4,8%</td></tr></tbody></table></div><p class=\"figure-caption\">Trong tạp chất không chứa gốc của acid béo.</p><p>Một nhà mày sản xuất xà phòng bằng cách xà phòng hóa 100 kg chất béo trên bằng dung dịch NaOH với hiệu suất phản ứng của từng chất là 80%. Toàn bộ lượng muối của các acid béo được đem để sản xuất xà phòng (chứa 72% khối lượng là muối của các acid béo). Lượng xà phòng này đem đóng gói thành xà phòng thành phẩm với quy cách đóng gói mỗi bánh xà phòng có khối lượng là 90 gam. Tính số bánh xà phòng mà nhà máy sản xuất được? (kết quả làm tròn số đến phần nguyên).</p>","answer":"1213","aliases":[],"explanation":"Trong 100kg hỗn hợp có 44,50kg tristearin, 24,18kg tripalmitin, 26,52kg triolein. Muối sodium lý thuyết: 44,50×918/890 +24,18×834/806 +26,52×912/884 ≈98,2kg. Hiệu suất 80% cho ≈78,6kg muối. Mỗi bánh 90g chứa 72% muối (=0,0648kg), nên k≈78,6/0,0648≈1213 bánh (làm tròn)."},{"id":"q100","type":"short","text":"Một loại chất béo có chứa tristearin, tripalmitin, stearic acid, palmitic acid. Thành phần % về khối lượng và hiệu suất phản ứng của các chất khi xà phòng hóa chất béo này bằng dung dịch NaOH như sau: Thành phần Tristearin Tripalmitin Stearic Palmitic Tạp acid acid chất % khối lượng 53,400 32,240 1,136 1,536 11,688 Hiệ̣u suất phản ứng với 90% 88% 100% 100% NaOH Một nhà máy cần sản xuất 3000 bánh xà phòng loại 100 gam (chứa 72% khối lượng muối sodium của các acid béo) bằng cách xà phòng hóa x kg chất béo nói trên với dung dịch NaOH. Biết trong quá trình đóng gói, lượng muối sodium của các acid béo bị hao hụt 4%. Tính giá trị của x? (làm tròn kết quả đến hàng đơn vị).","contentHtml":"<p>Một loại chất béo có chứa tristearin, tripalmitin, stearic acid, palmitic acid. Thành phần % về khối\n lượng và hiệu suất phản ứng của các chất khi xà phòng hóa chất béo này bằng dung dịch NaOH như sau:</p><div class=\"table-scroll\"><table><thead><tr><th>Thành phần</th><th>Tristearin</th><th>Tripalmitin</th><th>Stearic acid</th><th>Palmitic acid</th><th>Tạp chất</th></tr></thead><tbody><tr><td>% khối lượng</td><td>53,400</td><td>32,240</td><td>1,136</td><td>1,536</td><td>11,688</td></tr><tr><td>Hiệu suất với NaOH</td><td>90%</td><td>88%</td><td>100%</td><td>100%</td><td>—</td></tr></tbody></table></div><p>Một nhà máy cần sản xuất 3000 bánh xà phòng loại 100 gam (chứa 72% khối lượng muối sodium của các acid béo) bằng cách xà phòng hóa x kg chất béo nói trên với dung dịch NaOH. Biết trong quá trình đóng gói, lượng muối sodium của các acid béo bị hao hụt 4%. Tính giá trị của x? (làm tròn kết quả đến hàng đơn vị).</p>","answer":"275","aliases":[],"explanation":"Sản phẩm cần 3000×100g×72%=216kg muối trong bánh. Tính hao hụt đóng gói 4%: lượng muối trước đóng gói cần 216/0,96=225kg. Với 1kg hỗn hợp, muối tạo ra =0,534×(918/890)×0,90 +0,3224×(834/806)×0,88 +0,01136×(306/284) +0,01536×(278/256) ≈0,818kg. Vậy x=225/0,818≈275kg."}]}</script>
